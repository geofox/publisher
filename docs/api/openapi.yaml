  /v1/public/feed:
    get:
      operationId: getPublicFeed
      tags: [tools]
      summary: Your published posts, for a homepage
      description: |
        Gated by its own token (`PUBLIC_FEED_TOKEN`), not an API token, so
        a website's server can read it while holding nothing that can
        post. `404` while no feed token is configured. Lists published,
        unhidden posts that aren't replies, with their public links (a
        Mastodon post that isn't public is left out), newest first.
      security:
        - feedToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFeed"
        "400":
