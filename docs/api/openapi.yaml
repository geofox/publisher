            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: A page of drafts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DraftListItem"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDraft
      tags: [drafts]
      summary: Save a draft
      description: |
        Needs `drafts:write`. `post` is a `POST /v1/posts` body as it stands:
        nothing is required yet, but what is there must be within a post's
        bounds and name your own media and accounts. A schedule may be in
        the past (the post refuses it, not the draft). The title defaults to
        the text's first line. Answers with the draft's `ETag`.
      security:
        - bearer: ["drafts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftIn"
      responses:
        "201":
          description: The draft.
          headers:
            ETag:
              $ref: "#/components/headers/DraftETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/DraftID"
    get:
      operationId: getDraft
      tags: [drafts]
      summary: One draft, with its media objects
      description: Needs `drafts:read`. The `ETag` is the draft's version, for `If-Match`.
      security:
        - bearer: ["drafts:read"]
        - session: []
      responses:
        "200":
          description: The draft.
          headers:
            ETag:
              $ref: "#/components/headers/DraftETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateDraft
      tags: [drafts]
      summary: Change a draft
      description: |
        Needs `drafts:write`. Each field sent replaces the draft's: `post`
        as a whole (this is not a merge patch); a field left out or null is
        kept. Send `If-Match` with the ETag you read: if the draft changed
        since (another tab saved it), the answer is `412
        precondition_failed` with the current `ETag`, and nothing changes.
        Without `If-Match` (or with `*`) the change applies to the draft as
        the server reads it, and is still refused (412) if another write
        lands in between.
      security:
        - bearer: ["drafts:write"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftIn"
      responses:
        "200":
          description: The draft after the change.
          headers:
            ETag:
              $ref: "#/components/headers/DraftETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDraft
      tags: [drafts]
      summary: Delete a draft
      description: |
        Needs `drafts:write`. With `If-Match`, only the version you read (a
        changed draft answers 412). Its media objects stay.
      security:
        - bearer: ["drafts:write"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Problem"
  /v1/drafts/{id}:translate:
    parameters:
      - $ref: "#/components/parameters/DraftID"
    post:
      operationId: translateDraft
      tags: [drafts]
      summary: Make a translated copy of a draft
      description: |
        Needs `drafts:write` and `posts:write` (it spends the DeepL quota).
        A new draft: the same post with its text in `target_lang` and
        `content.languages` set to it; per-account texts and languages are
        left out, since they were for the original language. The original
        stays. 503 when the server has no DeepL key.
      security:
        - bearer: ["drafts:write", "posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateDraftIn"
      responses:
        "201":
          description: The new draft.
          headers:
            ETag:
              $ref: "#/components/headers/DraftETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}/events:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      operationId: streamPostEvents
      tags: [events]
      summary: A post's events, as server-sent events
      description: |
        Needs `posts:read`. Replays the post's events from the start (or
        after `Last-Event-ID` / `after`; the header wins), then streams
        new ones, and ends after `post.completed`, once the post has
        nothing left to send (automatic retries included). Close an
        EventSource on `post.completed`; one that reconnects anyway gets
        204, which stops it. Each message has `id`, `event` (the type) and
        `data` (an Event as JSON). A stream also ends after an hour or when
        the server stops: reconnect with `Last-Event-ID`. Events are kept
        7 days. Too many open streams: 503 with `Retry-After`.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/LastEventID"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "204":
          description: The post has settled and the client has every event.
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: All the owner's events, as server-sent events
      description: |
        Needs `posts:read`. Streams events from now on (or after
        `Last-Event-ID` / `after`, for a client catching up) until the
        client disconnects (the header wins over `after`); a `: ping`
        comment every 15 seconds keeps idle connections open. A stream
        ends after an hour or when the server stops: reconnect with
        `Last-Event-ID`. Events are kept 7 days. Too many open streams:
        503 with `Retry-After`.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/LastEventID"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token, created with `POST /v1/tokens` or in the web app.
    session:
      type: apiKey
      in: cookie
      name: publisher_session
      description: The web app's session, set by signing in (`/auth/login`).
    feedToken:
      type: http
      scheme: bearer
      description: The public feed's own token (`PUBLIC_FEED_TOKEN`); it can do nothing else.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key naming this request, so a retry gets the first response
        instead of a second post: a quoted string of 1 to 255 visible ASCII
        characters (`"6f1c2b"`).
      schema:
        type: string
        maxLength: 257
    Prefer:
      name: Prefer
      in: header
      description: "`wait=N` (RFC 7240): wait up to N seconds (at most 60) for the outcome."
      schema:
        type: string
    AccountID:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [acc_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    DraftID:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [drf_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    IfMatch:
      name: If-Match
      in: header
      description: The draft's ETag as you read it (`"3"`), or `*` for any version.
      schema:
        type: string
    PostID:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [pst_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    LastEventID:
      name: Last-Event-ID
      in: header
      description: Resume after this event id (browsers send it on reconnect).
      schema:
        type: string
        pattern: "^[0-9]+$"
    After:
      name: after
      in: query
      description: Resume after this event id, for clients that can't set headers.
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The previous page's `next_cursor`, unchanged.
      schema:
        type: string
  headers:
    DraftETag:
      description: The draft's version, a strong ETag (`"3"`), for `If-Match`.
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'
  responses:
    PreconditionFailed:
      description: |
        The resource changed since you read it (`precondition_failed`); the
        `ETag` header is its current version.
      headers:
        ETag:
          $ref: "#/components/headers/DraftETag"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidState:
      description: Not possible in the resource's current state (`invalid_state`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    EventStream:
      description: |
        A stream of server-sent events. Each message's `data` is an Event.
      content:
        text/event-stream:
          schema:
            type: string
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The body is not acceptable JSON (`invalid_json`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadParameter:
      description: A query parameter is invalid (`invalid_parameter`, `invalid_cursor`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: No credentials, or credentials the server does not accept (`unauthenticated`).
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InsufficientScope:
      description: |
        The token lacks the operation's scope (`insufficient_scope`, with
        `WWW-Authenticate` naming it), or a browser write came from another
        site (`cross_origin`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource for this caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: Some fields are invalid (`validation_failed`); `errors` lists them.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PostStatus:
      type: string
      description: |
        `scheduled`, `publishing` (queued or being sent), then `published`,
        `partial` (some of it went out), `failed`, `canceled` or `missed`
        (a scheduled time passed while the server was down). Any settled
        post with an item in an unknown state, or one the engine gave up
        retrying, is `needs_attention`.
      enum: [scheduled, publishing, published, partial, failed, canceled, missed, needs_attention]
    Post:
      type: object
      additionalProperties: false
      required: [id, status, created_at, scheduled_at, hidden, source, content, interaction, targets]
      properties:
        id:
          type: string
          pattern: "^pst_"
        status:
          $ref: "#/components/schemas/PostStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        scheduled_at:
          $ref: "#/components/schemas/NullableTimestamp"
        hidden:
          type: boolean
        source:
          type: string
          description: What created it (web, api, …).
        content:
          type: object
          additionalProperties: false
          required: [text, media]
          properties:
            text:
              type: string
            media:
              type: array
              items:
                $ref: "#/components/schemas/PostMedia"
        interaction:
          description: Set when the post replies to, quotes or reposts another post.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [action, url]
              properties:
                action:
                  type: string
                  enum: [reply, quote, repost]
                url:
                  type: string
                platform:
                  type: string
                author:
                  type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"
    PostCreate:
      type: object
      additionalProperties: false
      required: [content, targets]
      properties:
        content:
          $ref: "#/components/schemas/PostContentIn"
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/TargetIn"
        threading:
          type: object
          additionalProperties: false
          properties:
            numbering:
              type: boolean
              description: Add 1/n counters to the parts of a split post.
        schedule:
          type: object
          additionalProperties: false
          required: [at]
          properties:
            at:
              type: string
              format: date-time
              description: When to publish; in the future. Leave `schedule` out to publish now.
        reply_to:
          $ref: "#/components/schemas/SourceIn"
        quote:
          $ref: "#/components/schemas/SourceIn"
        repost:
          $ref: "#/components/schemas/SourceIn"
        draft:
          type: string
          pattern: "^drf_"
          description: |
            The draft this post is made from: it is used up (deleted) as
            the post is saved, so posting it twice makes one post. Needs
            `drafts:write` too (`not_permitted` otherwise); `unknown_draft`
            when there is no such draft (or it was just posted),
            `draft_changed` when it was saved again after this request
            read it.
      example:
        content:
          text: "Hello from the API"
          media: [{id: med_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c, alt: "A gradient"}]
          languages: [en]
        targets:
          - account: acc_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c
            options: {reply_gate: following}
          - account: acc_0d3e4f5a6b7c8d9e0f1a2b3c6f1c2b9a
            options: {visibility: unlisted}
            content: {content_warning: politics}
        threading: {numbering: true}
    DraftIn:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: Defaults to the text's first line ("" too).
        tags:
          type: array
          maxItems: 20
          description: Lowercased, without a leading `#`, cut to 32 characters, without repeats.
          items:
            type: string
            maxLength: 64
        post:
          $ref: "#/components/schemas/DraftPost"
    DraftPost:
      type: object
      additionalProperties: false
      description: A `POST /v1/posts` body in the making (PostCreate without its requirements, and without `draft`).
      properties:
        content:
          $ref: "#/components/schemas/PostContentIn"
        targets:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TargetIn"
        threading:
          type: object
          additionalProperties: false
          properties:
            numbering:
              type: boolean
        schedule:
          type: object
          additionalProperties: false
          required: [at]
          properties:
            at:
              type: string
              format: date-time
        reply_to:
          $ref: "#/components/schemas/SourceIn"
        quote:
          $ref: "#/components/schemas/SourceIn"
        repost:
          $ref: "#/components/schemas/SourceIn"
    Draft:
      type: object
      additionalProperties: false
      required: [id, title, tags, post, media, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^drf_"
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        post:
          $ref: "#/components/schemas/DraftPost"
        media:
          type: array
          description: The media objects `post` names, in its order (any since deleted are left out).
          items:
            $ref: "#/components/schemas/MediaObject"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    DraftListItem:
      type: object
      additionalProperties: false
      required: [id, title, preview, tags, media_url, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^drf_"
        title:
          type: string
        preview:
          type: string
          description: The start of the text, on one line (at most 120 characters).
        tags:
          type: array
          items:
            type: string
        media_url:
          type: ["string", "null"]
          description: The first media's URL (a video's poster), for a thumbnail.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    TranslateDraftIn:
      type: object
      additionalProperties: false
      required: [target_lang]
      properties:
        target_lang:
          type: string
          description: An ISO 639-1 code from `GET /v1/instance` `translate_targets`.
    SourceIn:
      type: object
      additionalProperties: false
      required: [url]
      description: |
        A post to act on, by its URL (or a Nostr nevent/note id). Set at most
        one of `reply_to`, `quote` and `repost`. The server resolves it; the
        action happens on your account on the source's network, which
        `targets` must include. Only a quote may have other targets: each
        gets a link-quote: your text, the original's text with its author
        (at most 500 characters, with its mentions defused so nobody is
        notified), its URL, and, best-effort, up to four of its images
        copied after yours (not videos). A repost carries no content,
        content settings or options. A Mastodon quote can't carry a video.
        These are sent now: `schedule` is refused. The URL is resolved
        as in `POST /v1/resolve`, with the same errors.
      properties:
        url:
          type: string
          maxLength: 2048
    PostContentIn:
      type: object
      additionalProperties: false
      description: What every target posts unless it overrides it. A post needs text or media.
      properties:
        text:
          type: string
          maxLength: 50000
        media:
          type: array
          maxItems: 40
          description: Images, or one video. Each must be `ready`.
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id:
                type: string
                pattern: "^med_"
              alt:
                type: ["string", "null"]
                description: Alt text for this post; null or absent uses the media object's.
              part:
                type: ["integer", "null"]
                minimum: 0
                maximum: 99
                description: >-
                  The part of the text (0-based; parts are split by lines of `---`) this media
                  goes with; default 0. A part past the last is the last, counted in each
                  account's own text. Not for a reply or quote (their media go with the first part).
        content_warning:
          type: ["string", "null"]
          maxLength: 1000
        sensitive:
          type: ["boolean", "null"]
        languages:
          type: ["array", "null"]
          maxItems: 10
          items:
            type: string
    TargetIn:
      type: object
      additionalProperties: false
      required: [account]
      properties:
        account:
          type: string
          description: An enabled account's id, from `GET /v1/accounts`. One account per destination type for now.
        options:
          type: object
          description: The destination's options by key (`GET /v1/destinations`), and `visibility` where the account lists values. null leaves an option at its default.
          additionalProperties: true
        content:
          type: object
          additionalProperties: false
          description: This account's overrides; a field left out or null inherits. `languages` [] sends none. `text` can't be blank (leave it out to use the shared text).
          properties:
            text:
              type: ["string", "null"]
              maxLength: 50000
            content_warning:
              type: ["string", "null"]
              maxLength: 1000
            sensitive:
              type: ["boolean", "null"]
            languages:
              type: ["array", "null"]
              maxItems: 10
              items:
                type: string
    PostPreview:
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [account, type, role, items, link_card, warnings, media_notes]
            properties:
              account:
                type: string
              type:
                type: string
              role:
                type: string
                enum: [post, reply, quote, repost, link_quote]
                description: What the account gets; `link_quote` is a quote's copy on another network.
              items:
                type: array
                description: The thread parts, in order; one for a post that fits.
                items:
                  type: object
                  additionalProperties: false
                  required: [text, media]
                  properties:
                    text:
                      type: string
                    media:
                      type: array
                      description: Indexes into `content.media`.
                      items:
                        type: integer
              link_card:
                description: The card this account gets, on item `item`; null for none.
                oneOf:
                  - type: "null"
                  - type: object
                    additionalProperties: false
                    required: [item, url, title, description]
                    properties:
                      item:
                        type: integer
                      url:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      thumb_url:
                        type: string
              warnings:
                type: array
                items:
                  type: string
              media_notes:
                type: array
                description: Media that will be converted to fit this account.
                items:
                  type: object
                  additionalProperties: false
                  required: [media, note]
                  properties:
                    media:
                      type: integer
                    note:
                      type: string
    TranslateIn:
      type: object
      additionalProperties: false
      required: [text, target_lang]
      properties:
        text:
          type: string
          maxLength: 50000
        target_lang:
          type: string
          description: An ISO 639-1 code DeepL translates into, such as `fr`.
          examples: [fr]
    Translation:
      type: object
      additionalProperties: false
      required: [text, detected_source_language]
      properties:
        text:
          type: string
        detected_source_language:
          type: string
          description: ISO 639-1, as DeepL detected it.
    VerifyIn:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: string
          description: A Nostr event's JSON, a post URL, or an at:// URI.
        platform:
          type: string
          enum: [nostr, bluesky, mastodon, threads]
          description: Leave it out to detect the platform from `input`.
        expected:
          type: string
          maxLength: 500
          description: An identity to match the signer against (an npub, handle, DID or acct).
    Verdict:
      type: object
      additionalProperties: false
      required: [platform, status, checks]
      properties:
        platform:
          type: string
        status:
          type: string
          enum: [verified, failed, error]
        assurance:
          type: string
          enum: [cryptographic, origin]
          description: "`cryptographic`: a signature checked against the key; `origin`: the post was fetched from the server that hosts its author."
        signer:
          type: object
          additionalProperties: false
          properties:
            pubkey_hex:
              type: string
            npub:
              type: string
            did:
              type: string
            handle:
              type: string
            handle_verified:
              type: boolean
            pds:
              type: string
            actor_uri:
              type: string
            acct:
              type: string
            origin_host:
              type: string
        expected:
          type: object
          additionalProperties: false
          required: [provided, matches]
          properties:
            provided:
              type: string
            matches:
              type: boolean
            detail:
              type: string
        content:
          type: object
          additionalProperties: false
          properties:
            text:
              type: string
            created_at:
              type: string
            kind:
              type: string
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, result]
            properties:
              name:
                type: string
              result:
                type: string
                enum: [pass, fail, skip]
              detail:
                type: string
        warnings:
          type: array
          items:
            type: string
        error:
          type: string
          description: Why the check could not complete (status `error`).
    NostrRelays:
      type: object
      additionalProperties: false
      required: [home, nip65, secondary, targets, nip65_error]
      properties:
        home:
          type: string
          description: The relay the others are compared with.
        nip65:
          type: array
          description: The write relays your profile lists, read from relays.
          items:
            type: string
        secondary:
          type: array
          description: The relays added on this server.
          items:
            type: string
        targets:
          type: array
          description: The relays a scan or sync goes through, in order.
          items:
            type: object
            additionalProperties: false
            required: [url, group]
            properties:
              url:
                type: string
              group:
                type: string
                enum: [nip65, secondary]
        nip65_error:
          type: ["string", "null"]
          description: Why the NIP-65 relays couldn't be read (they are then missing from `nip65` and `targets`); null when they were.
    NostrRelaysIn:
      type: object
      additionalProperties: false
      required: [secondary]
      properties:
        secondary:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 512
    RelaySelection:
      type: object
      additionalProperties: false
      properties:
        relays:
          type: array
          description: Only these targets (all of them when left out or empty).
          items:
            type: string
    RelaySyncIn:
      type: object
      additionalProperties: false
      required: [direction]
      properties:
        direction:
          type: string
          enum: [pull, push]
        relays:
          type: array
          description: Only these targets (all of them when left out or empty).
          items:
            type: string
    RelayScan:
      type: object
      additionalProperties: false
      required: [url, group, missing_at_home, missing_at_relay, status]
      properties:
        url:
          type: string
        group:
          type: string
          enum: [nip65, secondary]
        missing_at_home:
          type: integer
        missing_at_relay:
          type: integer
        status:
          type: string
          enum: [ok, unreachable, auth, error]
        message:
          type: string
    RelaySyncResult:
      type: object
      additionalProperties: false
      required: [url, direction, published, failed, status]
      properties:
        url:
          type: string
        direction:
          type: string
          enum: [pull, push]
        published:
          type: integer
        failed:
          type: integer
        status:
          type: string
          enum: [ok, partial, unreachable, auth, error]
          description: "`partial`: some events were accepted and some refused (see `message`)."
        message:
          type: string
    PublicFeed:
      type: object
      additionalProperties: false
      required: [version, generated_at, posts]
      properties:
        version:
          type: integer
          const: 1
        generated_at:
          type: string
          format: date-time
        posts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, published_at, text, links]
            properties:
              id:
                type: string
              published_at:
                type: string
                format: date-time
              text:
                type: string
              media:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [url, mime]
                  properties:
                    url:
                      type: string
                    mime:
                      type: string
                    alt:
                      type: string
                    dim:
                      type: string
                    blurhash:
                      type: string
              interaction:
                type: object
                additionalProperties: false
                required: [action, source_platform, source_url, source_author]
                properties:
                  action:
                    type: string
                    enum: [quote, repost]
                  source_platform:
                    type: string
                  source_url:
                    type: string
                  source_author:
                    type: string
              links:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [platform, url]
                  properties:
                    platform:
                      type: string
                    url:
                      type: string
    ResolvedSource:
      type: object
      additionalProperties: false
      required: [platform, url, author, text, media, created_at, account, actions]
      properties:
        platform:
          type: string
        url:
          type: string
        author:
          type: object
          additionalProperties: false
          required: [name, handle]
          properties:
            name:
              type: string
            handle:
              type: string
        text:
          type: string
        media:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [url, alt, type]
            properties:
              url:
                type: string
              alt:
                type: string
              type:
                type: string
                enum: [image, video]
                description: A link-quote copies images only.
        created_at:
          $ref: "#/components/schemas/NullableTimestamp"
        account:
          type: ["string", "null"]
          description: Your enabled account on the post's network; null when you have none.
        actions:
          type: object
          additionalProperties: false
          required: [reply, quote, repost]
          properties:
            reply:
              $ref: "#/components/schemas/ActionAvailability"
            quote:
              $ref: "#/components/schemas/ActionAvailability"
            repost:
              $ref: "#/components/schemas/ActionAvailability"
    ActionAvailability:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          description: |
            Why not, when not allowed. An allowed action may have one too, as
            a note (a Mastodon quote that needs the author's approval lands
            pending); `POST /v1/posts:preview` repeats it as a warning.
    MediaObject:
      type: object
      additionalProperties: false
      required: [id, status, mime, alt, url, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^med_"
        status:
          type: string
          enum: [processing, ready, failed]
        mime:
          type: string
        alt:
          type: string
        url:
          type: ["string", "null"]
          description: The file in media storage; null until it is ready.
        sha256:
          type: string
        size_bytes:
          type: integer
        dim:
          type: string
          description: WIDTHxHEIGHT.
        blurhash:
          type: string
        duration_secs:
          type: integer
        poster_url:
          type: string
        error:
          type: string
          description: Why processing failed.
        processing:
          type: object
          additionalProperties: false
          required: [stage, progress]
          properties:
            stage:
              type: string
            progress:
              type: number
              minimum: 0
              maximum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    MediaPatch:
      type: object
      additionalProperties: false
      required: [alt]
      properties:
        alt:
          type: string
          maxLength: 10000
    PostMedia:
      type: object
      additionalProperties: false
      required: [url, mime]
      properties:
        url:
          type: string
        mime:
          type: string
        alt:
          type: string
        sha256:
          type: string
        size_bytes:
          type: integer
        dim:
          type: string
          description: WIDTHxHEIGHT.
        blurhash:
          type: string
        duration_secs:
          type: integer
        poster_url:
          type: string
    TargetStatus:
      type: string
      enum: [scheduled, publishing, published, partial, failed, canceled, missed]
    Target:
      type: object
      description: One account the post goes to. Items and attempts are in a single post's view only.
      additionalProperties: false
      required: [id, account, type, status, gave_up_at]
      properties:
        id:
          type: string
          pattern: "^tgt_"
        account:
          type: string
          pattern: "^acc_"
        type:
          type: string
          description: The destination type.
        status:
          $ref: "#/components/schemas/TargetStatus"
        error_class:
          type: string
          description: The class of the latest failure (transient, rate_limited, auth, invalid, unknown, …).
        gave_up_at:
          description: When automatic retries stopped; a retry by hand starts them again.
          $ref: "#/components/schemas/NullableTimestamp"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
    ItemStatus:
      type: string
      enum: [planned, sending, published, partial, failed, unknown, canceled]
      description: "`unknown`: a send was in flight when the server stopped, and whether it went out is not known."
    Item:
      type: object
      description: One post the target makes (one, or one per thread part).
      additionalProperties: false
      required: [ordinal, status, text, media, attempts, next_attempt_at, published_at, deliveries]
      properties:
        ordinal:
          type: integer
        status:
          $ref: "#/components/schemas/ItemStatus"
        text:
          type: string
        media:
          type: array
          description: Indexes into the post's content.media.
          items:
            type: integer
        url:
          type: string
        remote_id:
          type: string
        error:
          type: string
        error_class:
          type: string
        attempts:
          type: integer
        next_attempt_at:
          description: When the engine sends it next; null when nothing is planned.
          $ref: "#/components/schemas/NullableTimestamp"
        published_at:
          $ref: "#/components/schemas/NullableTimestamp"
        deliveries:
          type: array
          description: Per-endpoint results, for destinations that deliver to several (Nostr relays).
          items:
            $ref: "#/components/schemas/Delivery"
    Delivery:
      type: object
      additionalProperties: false
      required: [endpoint, status, retries, attempted_at, gave_up_at]
      properties:
        endpoint:
          type: string
        status:
          type: string
          enum: [ok, failed, skipped, pending]
        message:
          type: string
        retries:
          type: integer
        attempted_at:
          $ref: "#/components/schemas/NullableTimestamp"
        gave_up_at:
          $ref: "#/components/schemas/NullableTimestamp"
    Attempt:
      type: object
      additionalProperties: false
      required: [number, status, latency_ms, attempted_at]
      properties:
        number:
          type: integer
        status:
          type: string
        error:
          type: string
        error_class:
          type: string
        latency_ms:
          type: integer
        attempted_at:
          $ref: "#/components/schemas/Timestamp"
    PostPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        schedule:
          type: object
          additionalProperties: false
          required: [at]
          properties:
            at:
              type: string
              format: date-time
        hidden:
          type: boolean
    RetryRequest:
      type: object
      additionalProperties: false
      properties:
        targets:
          type: array
          items:
            type: string
            pattern: "^tgt_"
        deliveries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [target, endpoint]
            properties:
              target:
                type: string
                pattern: "^tgt_"
              endpoint:
                type: string
    ResolveItemRequest:
      type: object
      additionalProperties: false
      required: [target, ordinal, outcome]
      properties:
        target:
          type: string
          pattern: "^tgt_"
          description: The item's target.
        ordinal:
          type: integer
          minimum: 0
          maximum: 99
          description: The item's place in its target, from 0.
        outcome:
          type: string
          enum: [published, not_published]
        url:
          type: string
          maxLength: 2048
          description: The live post's URL; only with `published`.
    Event:
      type: object
      description: |
        The `data` of one server-sent event. Types: `post.created`,
        `post.updated` (status, schedule or visibility), `post.completed`
        (nothing left to send), `item.sending`, `item.published`,
        `item.partial`, `item.failed`, `item.unknown`, `item.canceled`,
        `delivery.updated`. Fields are present as the type needs.
      additionalProperties: false
      required: [id, type, created_at, post]
      properties:
        id:
          type: integer
        type:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        post:
          type: string
          pattern: "^pst_"
        status:
          type: string
          description: The post's status for post events; the item's or delivery's otherwise.
        target:
          type: string
        account:
          type: string
        destination:
          type: string
        ordinal:
          type: integer
        url:
          type: string
        error_class:
          type: string
        error:
          type: string
        endpoint:
          type: string
        scheduled_at:
          $ref: "#/components/schemas/Timestamp"
        hidden:
          type: boolean
    Problem:
      type: object
      description: An RFC 9457 problem with a stable `code`. Clients should ignore members they don't know (RFC 9457 §3.2).
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: This error's entry in the error catalogue.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: The request path.
        code:
          type: string
          enum:
            - not_found
            - method_not_allowed
            - unauthenticated
            - insufficient_scope
            - cross_origin
            - invalid_json
            - unsupported_media_type
            - too_large
            - validation_failed
            - invalid_parameter
            - invalid_cursor
            - invalid_state
            - idempotency_key_invalid
            - idempotency_key_in_use
            - idempotency_key_reused
            - precondition_failed
            - unreadable_upload
            - unavailable
            - upstream_failed
            - insufficient_storage
            - internal
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer into the request body.
        parameter:
          type: string
          description: A query parameter's name.
        code:
          type: string
        detail:
          type: string
    NextCursor:
      description: The cursor for the next page; null on the last page.
      type: [string, "null"]
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, "null"]
      format: date-time
    Scope:
      type: string
      enum: ["posts:read", "posts:write", "media:write", "drafts:read", "drafts:write", "accounts:read", admin]
    Instance:
      type: object
      additionalProperties: false
      required: [version, auth, features, user_languages, translate_targets, limits, idempotency, scopes, destinations, pagination]
      properties:
        version:
          type: string
          description: The server build ("dev" for a local build).
        auth:
          type: string
          enum: [oidc, proxy]
          description: "`oidc`: the server signs people in. `proxy`: the reverse proxy in front is the gate."
        features:
          type: object
          additionalProperties: false
          required: [translate, video, public_feed, relay_sync]
          properties:
            translate:
              type: boolean
              description: DeepL translation is configured.
            video:
              type: boolean
              description: ffmpeg is present, so video can be processed.
            public_feed:
              type: boolean
              description: The public feed has a token.
            relay_sync:
              type: boolean
              description: Nostr relay-list sync is available.
        user_languages:
          type: array
          description: The operator's languages (ISO 639-1), in preference order.
          items:
            type: string
        translate_targets:
          type: array
          description: The user languages translation can target; empty without translation.
          items:
            type: string
        limits:
          type: object
          additionalProperties: false
          required: [max_json_body_bytes, max_upload_bytes, max_video_upload_bytes, max_images_per_request, max_idempotency_key_length]
          properties:
            max_json_body_bytes:
              type: integer
            max_upload_bytes:
              type: integer
            max_video_upload_bytes:
              type: integer
            max_images_per_request:
              type: integer
            max_idempotency_key_length:
              type: integer
        idempotency:
          type: object
          additionalProperties: false
          required: [ttl_secs]
          properties:
            ttl_secs:
              type: integer
              description: How long an Idempotency-Key is remembered.
        scopes:
          type: array
          description: The scopes a token can hold.
          items:
            $ref: "#/components/schemas/Scope"
        destinations:
          type: array
          description: The registered destination types.
          items:
            type: string
        pagination:
          type: object
          additionalProperties: false
          required: [default_limit, max_limit]
          properties:
            default_limit:
              type: integer
            max_limit:
              type: integer
    Manifest:
      type: object
      description: A destination type, the same for every account of it.
      additionalProperties: false
      required: [contract, type, name, kinds, defaults]
      properties:
        contract:
          type: integer
          description: The destination contract version the driver speaks.
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        name:
          type: string
        kinds:
          type: array
          items:
            type: string
            enum: [note, article]
        options:
          type: array
          description: The type's own settings, for a UI to render and the server to validate.
          items:
            $ref: "#/components/schemas/OptionSpec"
        defaults:
          $ref: "#/components/schemas/Capabilities"
    OptionSpec:
      type: object
      additionalProperties: false
      required: [key, type, label]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [bool, string, int, enum, enum_list]
        enum:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value:
                type: string
                description: '"" means the default.'
              label:
                type: string
        label:
          type: string
        help:
          type: string
        min:
          type: integer
        max:
          type: integer
    Capabilities:
      type: object
      description: What an account can do. Zero limits mean no limit.
      additionalProperties: false
      required: [text, title, threading, media, link_preview, content_warning, sensitive, languages, interactions, idempotent]
      properties:
        text:
          type: object
          additionalProperties: false
          required: [max_length, counting]
          properties:
            max_length:
              type: integer
            counting:
              type: object
              additionalProperties: false
              required: [unit]
              properties:
                unit:
                  type: string
                  description: graphemes, codepoints, utf16 or bytes ("" means graphemes).
                url_length:
                  type: integer
                  description: The fixed cost of every URL, when the network has one.
                mention_local_part_only:
                  type: boolean
        title:
          type: object
          additionalProperties: false
          required: [supported, required]
          properties:
            supported:
              type: boolean
            required:
              type: boolean
            max_length:
              type: integer
        threading:
          type: object
          additionalProperties: false
          required: [supported]
          properties:
            supported:
              type: boolean
            max_items:
              type: integer
        media:
          type: object
          additionalProperties: false
          required: [transport, images, video, mix_images_video, alt_text]
          properties:
            transport:
              type: string
              enum: [bytes, url]
            images:
              $ref: "#/components/schemas/MediaLimit"
            video:
              $ref: "#/components/schemas/MediaLimit"
            mix_images_video:
              type: boolean
            alt_text:
              type: boolean
            alt_max_length:
              type: integer
        link_preview:
          type: string
          enum: [none, server, client]
        content_warning:
          type: boolean
        sensitive:
          type: boolean
        languages:
          type: integer
          description: How many language tags a post can carry.
        visibility:
          type: array
          items:
            type: string
        interactions:
          type: object
          additionalProperties: false
          required: [reply, quote, repost, quote_video]
          properties:
            reply:
              type: boolean
            quote:
              type: boolean
            repost:
              type: boolean
            quote_video:
              type: boolean
              description: A native quote can carry a video.
        idempotent:
          type: string
          enum: [none, key, natural]
          description: How a repeated publish of one item behaves on the network.
        idempotency_key_ttl_secs:
          type: integer
    MediaLimit:
      type: object
      additionalProperties: false
      required: [supported]
      properties:
        supported:
          type: boolean
        max_count:
          type: integer
        max_bytes:
          type: integer
        max_pixels:
          type: integer
        mimes:
          type: array
          items:
            type: string
        max_duration_secs:
          type: integer
        advisory_duration_secs:
          type: integer
    Account:
      type: object
      additionalProperties: false
      required: [id, type, label, source, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^acc_"
        type:
          type: string
          description: The destination type.
        label:
          type: string
        handle:
          type: string
        display_name:
          type: string
        avatar:
          type: string
          format: uri
          description: An absolute http(s) URL; absent when the profile has none.
        source:
          type: string
          description: Where the account is configured (`env` for now).
        enabled:
          type: boolean
        capabilities:
          description: Absent when this server has no driver for the account's type.
          $ref: "#/components/schemas/Capabilities"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    Token:
      type: object
      additionalProperties: false
      required: [id, name, scopes, status, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          pattern: "^tok_"
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/NullableTimestamp"
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        revoked_at:
          $ref: "#/components/schemas/NullableTimestamp"
    CreatedToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, status, created_at, last_used_at, expires_at, revoked_at, secret]
      properties:
        id:
          type: string
          pattern: "^tok_"
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          type: "null"
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        revoked_at:
          type: "null"
        secret:
          type: string
          description: The bearer value. Shown once; store it now.
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the token is for, such as the script that uses it.
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the token stops working, kept to the second; omit or null for never.
      examples:
        - name: n8n cross-posting
          scopes: ["posts:write", "media:write"]
          expires_at: "2027-11-05T00:00:00Z"
    Me:
      type: object
      additionalProperties: false
      required: [kind, scopes]
      properties:
        kind:
          type: string
          enum: [session, token, proxy]
          description: "`session`: signed in. `token`: a bearer token. `proxy`: OIDC is off and the reverse proxy let the request through."
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        user:
          type: object
          description: The signed-in person (sessions only).
          additionalProperties: false
          required: [id, subject]
          properties:
            id:
              type: string
            subject:
              type: string
            email:
              type: string
            name:
              type: string
        token:
          $ref: "#/components/schemas/Token"
