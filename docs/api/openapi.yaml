  /v1/drafts:
    get:
      operationId: listDrafts
      tags: [drafts]
      summary: The drafts, the most recently changed first
      description: |
        Needs `drafts:read`. `q` finds drafts whose text or title contains
        it; each `tag` narrows to drafts with that tag (all of them).
      security:
        - bearer: ["drafts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Text to find in the draft's text or title.
          schema:
            type: string
        - name: tag
          in: query
          description: A tag the draft has; repeat for several.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: A page of drafts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DraftListItem"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDraft
      tags: [drafts]
      summary: Save a draft
      description: |
        Needs `drafts:write`. `post` is a `POST /v1/posts` body as it stands:
        nothing is required yet, but what is there must be within a post's
        bounds and name your own media and accounts. A schedule may be in
        the past (the post refuses it, not the draft). The title defaults to
        the text's first line. Answers with the draft's `ETag`.
      security:
        - bearer: ["drafts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftIn"
      responses:
        "201":
          description: The draft.
          headers:
            ETag:
              $ref: "#/components/headers/DraftETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/DraftID"
    get:
      operationId: getDraft
      tags: [drafts]
      summary: One draft, with its media objects
      description: Needs `drafts:read`. The `ETag` is the draft's version, for `If-Match`.
      security:
        - bearer: ["drafts:read"]
        - session: []
      responses:
        "200":
          description: The draft.
          headers:
            ETag:
              $ref: "#/components/headers/DraftETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateDraft
      tags: [drafts]
      summary: Change a draft
      description: |
        Needs `drafts:write`. Each field sent replaces the draft's: `post`
        as a whole (this is not a merge patch); a field left out or null is
        kept. Send `If-Match` with the ETag you read: if the draft changed
        since (another tab saved it), the answer is `412
        precondition_failed` with the current `ETag`, and nothing changes.
        Without `If-Match` (or with `*`) the change applies to the draft as
        the server reads it, and is still refused (412) if another write
        lands in between.
      security:
        - bearer: ["drafts:write"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftIn"
      responses:
        "200":
          description: The draft after the change.
          headers:
            ETag:
              $ref: "#/components/headers/DraftETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDraft
      tags: [drafts]
      summary: Delete a draft
      description: |
        Needs `drafts:write`. With `If-Match`, only the version you read (a
        changed draft answers 412). Its media objects stay.
      security:
        - bearer: ["drafts:write"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        default:
          $ref: "#/components/responses/Problem"
  /v1/drafts/{id}:translate:
    parameters:
      - $ref: "#/components/parameters/DraftID"
    post:
      operationId: translateDraft
      tags: [drafts]
      summary: Make a translated copy of a draft
      description: |
        Needs `drafts:write` and `posts:write` (it spends the DeepL quota).
        A new draft: the same post with its text in `target_lang` and
        `content.languages` set to it; per-account texts and languages are
        left out, since they were for the original language. Each part of a
        hand-broken thread is translated on its own: `content.breaks` and
        `media[].at` move to the translated parts' starts, and per-account
        `thread` settings are dropped. The original stays. 503 when the
        server has no DeepL key.
      security:
        - bearer: ["drafts:write", "posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateDraftIn"
      responses:
        "201":
          description: The new draft.
          headers:
            ETag:
              $ref: "#/components/headers/DraftETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}/events:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      operationId: streamPostEvents
      tags: [events]
      summary: A post's events, as server-sent events
      description: |
        Needs `posts:read`. Replays the post's events from the start (or
        after `Last-Event-ID` / `after`; the header wins), then streams
        new ones, and ends after `post.completed`, once the post has
        nothing left to send (automatic retries included). Close an
        EventSource on `post.completed`; one that reconnects anyway gets
        204, which stops it. Each message has `id`, `event` (the type) and
        `data` (an Event as JSON). A stream also ends after an hour or when
        the server stops: reconnect with `Last-Event-ID`. Events are kept
        7 days. Too many open streams: 503 with `Retry-After`.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/LastEventID"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "204":
          description: The post has settled and the client has every event.
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: All the owner's events, as server-sent events
      description: |
        Needs `posts:read`. Streams events from now on (or after
        `Last-Event-ID` / `after`, for a client catching up) until the
        client disconnects (the header wins over `after`). Account events
        are included only when the caller also has `accounts:read`. A `: ping`
        comment every 15 seconds keeps idle connections open. A stream
        ends after an hour or when the server stops: reconnect with
        `Last-Event-ID`. Events are kept 7 days. Too many open streams:
        503 with `Retry-After`.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/LastEventID"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token, created with `POST /v1/tokens` or in the web app.
    session:
      type: apiKey
      in: cookie
      name: publisher_session
      description: The web app's session, set by signing in (OIDC, or a passkey or password in `local` mode).
    feedToken:
      type: http
      scheme: bearer
      description: The public feed's own token (`PUBLIC_FEED_TOKEN`); it can do nothing else.
  parameters:
    Reauth:
      name: Publisher-Reauth
      in: header
      required: false
      description: |
        A re-authentication nonce for this operation: the owner confirmed
        it's them just now (`POST /auth/reauth` with a passkey or the
        password, or a fresh OIDC login). Good once, for five minutes, in
        the session that asked for it. An operation on one account
        (`account.delete`, `account.reveal`) names it as the `target` when
        re-authenticating, and its nonce is good for that account only.
        Without a valid one: `403 reauth_required`, naming the `operation`
        to re-authenticate for.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key naming this request, so a retry gets the first response
        instead of a second post: a quoted string of 1 to 255 visible ASCII
        characters (`"6f1c2b"`).
      schema:
        type: string
        maxLength: 257
    Prefer:
      name: Prefer
      in: header
      description: "`wait=N` (RFC 7240): wait up to N seconds (at most 60) for the outcome."
      schema:
        type: string
    AccountID:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [acc_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    DraftID:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [drf_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    IfMatch:
      name: If-Match
      in: header
      description: The draft's ETag as you read it (`"3"`), or `*` for any version.
      schema:
        type: string
    AccountIfMatch:
      name: If-Match
      in: header
      description: The account's ETag as you read it, or `*` for any version.
      schema:
        type: string
    PostID:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [pst_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    LastEventID:
      name: Last-Event-ID
      in: header
      description: Resume after this event id (browsers send it on reconnect).
      schema:
        type: string
        pattern: "^[0-9]+$"
    After:
      name: after
      in: query
      description: Resume after this event id, for clients that can't set headers.
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The previous page's `next_cursor`, unchanged.
      schema:
        type: string
  headers:
    DraftETag:
      description: The draft's version, a strong ETag (`"3"`), for `If-Match`.
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    AccountETag:
      description: |
        The account's version, a strong ETag (digits in quotes), for
        `If-Match`. It changes when your settings on it change, not when
        its status or profile does.
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'
  responses:
    SessionOnly:
      description: |
        Only a signed-in browser session can do this: `session_required`
        for a token, `sign_in_required` behind the reverse proxy alone
        (`AUTH_MODE=proxy`), or `cross_origin`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ReauthRequired:
      description: |
        `reauth_required` (re-authenticate for the problem's `operation`
        and send the nonce in `Publisher-Reauth`), or as for a
        session-only operation: `session_required`, `sign_in_required`,
        `cross_origin`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many attempts (`rate_limited`); `Retry-After` says when to try again.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: |
        The resource changed since you read it (`precondition_failed`); the
        `ETag` header is its current version.
      headers:
        ETag:
          $ref: "#/components/headers/DraftETag"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidState:
      description: Not possible in the resource's current state (`invalid_state`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    EventStream:
      description: |
        A stream of server-sent events. Each message's `data` is an Event.
      content:
        text/event-stream:
          schema:
            type: string
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The body is not acceptable JSON (`invalid_json`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadParameter:
      description: A query parameter is invalid (`invalid_parameter`, `invalid_cursor`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: No credentials, or credentials the server does not accept (`unauthenticated`).
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InsufficientScope:
      description: |
        The token lacks the operation's scope (`insufficient_scope`, with
        `WWW-Authenticate` naming it), or a browser write came from another
        site (`cross_origin`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource for this caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: Some fields are invalid (`validation_failed`); `errors` lists them.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PostStatus:
      type: string
      description: |
        `scheduled`, `publishing` (queued or being sent), then `published`,
        `partial` (some of it went out), `failed`, `canceled` or `missed`
        (a scheduled time passed while the server was down). Any settled
        post with an item in an unknown state, or one the engine gave up
        retrying, is `needs_attention`.
      enum: [scheduled, publishing, published, partial, failed, canceled, missed, needs_attention]
    Post:
      type: object
      additionalProperties: false
      required: [id, status, created_at, scheduled_at, hidden, source, content, interaction, targets]
      properties:
        id:
          type: string
          pattern: "^pst_"
        status:
          $ref: "#/components/schemas/PostStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        scheduled_at:
          $ref: "#/components/schemas/NullableTimestamp"
        hidden:
          type: boolean
        source:
          type: string
          description: What created it (web, api, …).
        content:
          type: object
          additionalProperties: false
          required: [text, media]
          properties:
            text:
              type: string
            media:
              type: array
              items:
                $ref: "#/components/schemas/PostMedia"
        interaction:
          description: Set when the post replies to, quotes or reposts another post.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [action, url]
              properties:
                action:
                  type: string
                  enum: [reply, quote, repost]
                url:
                  type: string
                platform:
                  type: string
                author:
                  type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"
    PostCreate:
      type: object
      additionalProperties: false
      required: [content, targets]
      properties:
        content:
          $ref: "#/components/schemas/PostContentIn"
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/TargetIn"
        threading:
          type: object
          additionalProperties: false
          properties:
            numbering:
              type: boolean
              description: Add 1/n counters to the parts of a split post.
        schedule:
          type: object
          additionalProperties: false
          required: [at]
          properties:
            at:
              type: string
              format: date-time
              description: When to publish; in the future. Leave `schedule` out to publish now.
        reply_to:
          $ref: "#/components/schemas/SourceIn"
        quote:
          $ref: "#/components/schemas/SourceIn"
        repost:
          $ref: "#/components/schemas/SourceIn"
        draft:
          type: string
          pattern: "^drf_"
          description: |
            The draft this post is made from: it is used up (deleted) as
            the post is saved, so posting it twice makes one post. Needs
            `drafts:write` too (`not_permitted` otherwise); `unknown_draft`
            when there is no such draft (or it was just posted),
            `draft_changed` when it was saved again after this request
            read it.
      example:
        content:
          text: "Hello from the API"
          media: [{id: med_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c, alt: "A gradient"}]
          languages: [en]
        targets:
          - account: acc_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c
            options: {reply_gate: following}
          - account: acc_0d3e4f5a6b7c8d9e0f1a2b3c6f1c2b9a
            options: {visibility: unlisted}
            content: {content_warning: politics}
        threading: {numbering: true}
    DraftIn:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: Defaults to the text's first line ("" too).
        tags:
          type: array
          maxItems: 20
          description: Lowercased, without a leading `#`, cut to 32 characters, without repeats.
          items:
            type: string
            maxLength: 64
        post:
          $ref: "#/components/schemas/DraftPost"
    DraftPost:
      type: object
      additionalProperties: false
      description: A `POST /v1/posts` body in the making (PostCreate without its requirements, and without `draft`).
      properties:
        content:
          $ref: "#/components/schemas/PostContentIn"
        targets:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TargetIn"
        threading:
          type: object
          additionalProperties: false
          properties:
            numbering:
              type: boolean
        schedule:
          type: object
          additionalProperties: false
          required: [at]
          properties:
            at:
              type: string
              format: date-time
        reply_to:
          $ref: "#/components/schemas/SourceIn"
        quote:
          $ref: "#/components/schemas/SourceIn"
        repost:
          $ref: "#/components/schemas/SourceIn"
    Draft:
      type: object
      additionalProperties: false
      required: [id, title, tags, post, media, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^drf_"
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        post:
          $ref: "#/components/schemas/DraftPost"
        media:
          type: array
          description: The media objects `post` names, in its order (any since deleted are left out).
          items:
            $ref: "#/components/schemas/MediaObject"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    DraftListItem:
      type: object
      additionalProperties: false
      required: [id, title, preview, tags, media_url, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^drf_"
        title:
          type: string
        preview:
          type: string
          description: The start of the text, on one line (at most 120 characters).
        tags:
          type: array
          items:
            type: string
        media_url:
          type: ["string", "null"]
          description: The first media's URL (a video's poster), for a thumbnail.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    TranslateDraftIn:
      type: object
      additionalProperties: false
      required: [target_lang]
      properties:
        target_lang:
          type: string
          description: An ISO 639-1 code from `GET /v1/instance` `translate_targets`.
    ResolveIn:
      type: object
      additionalProperties: false
      required: [url]
      description: A post to look up, by its URL (or a Nostr nevent/note id).
      properties:
        url:
          type: string
          maxLength: 2048
        account:
          type: string
          description: |
            The account to look the post up with: one of yours on the
            post's network, connected. A Mastodon post id is only valid on
            its own server, so this picks whose server answers. Absent: your
            first connected account on that network.
    SourceIn:
      type: object
      additionalProperties: false
      required: [url]
      description: |
        A post to act on, by its URL (or a Nostr nevent/note id). Set at most
        one of `reply_to`, `quote` and `repost`. The server resolves it; the
        action is made by the one account on the source's network that
        `targets` names (it must name one; a second is refused with
        `one_native_actor`), which looks the post up on its own server. Only
        a quote may have other targets: each
        gets a link-quote: your text, the original's text with its author
        (at most 500 characters, with its mentions defused so nobody is
        notified), its URL, and, best-effort, up to four of its images
        copied after yours (not videos). A repost carries no content,
        content settings or options. A Mastodon quote can't carry a video.
        These are sent now: `schedule` is refused. The URL is resolved
        as in `POST /v1/resolve`, with the same errors.
      properties:
        url:
          type: string
          maxLength: 2048
    PostContentIn:
      type: object
      additionalProperties: false
      description: What every target posts unless it overrides it. A post needs text or media.
      properties:
        text:
          type: string
          maxLength: 50000
          description: Posted as written; a line of `---` is text, not a break (use `breaks`).
        breaks:
          type: ["array", "null"]
          maxItems: 99
          description: >-
            Hand-made thread breaks: code point positions in `text`, strictly ascending, each
            starting a new post (between characters, never inside a link). They apply to every
            account that posts the shared text and has no `thread.breaks` of its own. Posts are
            still split to each account's limit after them.
          items:
            type: integer
        media:
          type: array
          maxItems: 40
          description: Images, or one video. Each must be `ready`.
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id:
                type: string
                pattern: "^med_"
              alt:
                type: ["string", "null"]
                description: Alt text for this post; null or absent uses the media object's.
              at:
                type: ["integer", "null"]
                minimum: 0
                description: >-
                  A code point position in `text`: the media goes with the post that holds it, on
                  every account that posts the shared text (default 0, the first post). A post that
                  is full passes it to the next.
              part:
                type: ["integer", "null"]
                deprecated: true
                description: Removed (it counted `---` parts); refused with code `replaced`. Use `at`.
        content_warning:
          type: ["string", "null"]
          maxLength: 1000
        sensitive:
          type: ["boolean", "null"]
        languages:
          type: ["array", "null"]
          maxItems: 10
          items:
            type: string
    TargetIn:
      type: object
      additionalProperties: false
      required: [account]
      properties:
        account:
          type: string
          description: |
            A connected account's id (`status: connected` in `GET
            /v1/accounts`); any other is refused with `account_disabled`.
            Two accounts of one network may be named, each once.
        options:
          type: object
          description: The destination's options by key (`GET /v1/destinations`), and `visibility` where the account lists values. null leaves an option at its default.
          additionalProperties: true
        content:
          type: object
          additionalProperties: false
          description: This account's overrides; a field left out or null inherits. `languages` [] sends none. `text` can't be blank (leave it out to use the shared text).
          properties:
            text:
              type: ["string", "null"]
              maxLength: 50000
            content_warning:
              type: ["string", "null"]
              maxLength: 1000
            sensitive:
              type: ["boolean", "null"]
            languages:
              type: ["array", "null"]
              maxItems: 10
              items:
                type: string
        thread:
          type: object
          additionalProperties: false
          description: How this account's thread breaks, in the text it posts (its own `content.text`, or the shared text).
          properties:
            breaks:
              type: ["array", "null"]
              maxItems: 99
              description: >-
                This account's breaks, replacing the shared ones: [] posts the text unbroken (still
                split to the account's limit). null or absent takes the shared breaks, or none when the
                account has its own text.
              items:
                type: integer
            media_at:
              type: ["array", "null"]
              description: >-
                One position per media in `content.media`, in this account's text. Absent: the
                shared `at` values, or the first post when the account has its own text.
              items:
                type: integer
                minimum: 0
    PostPreview:
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [account, type, role, text, limit, items, link_card, warnings, media_notes]
            properties:
              account:
                type: string
              type:
                type: string
              role:
                type: string
                enum: [post, reply, quote, repost, link_quote]
                description: What the account gets; `link_quote` is a quote's copy on another network.
              text:
                type: string
                description: >-
                  The text the items' ranges are in: the account's own or the shared text (with a
                  Bluesky link card's URL taken off its end), or the copy a link-quote posts.
              limit:
                type: integer
                description: The most one post may count on this account, after a content warning it counts in; 0 for no limit.
              items:
                type: array
                description: The thread parts, in order; one for a post that fits.
                items:
                  type: object
                  additionalProperties: false
                  required: [text, media, range, break, length, problems]
                  properties:
                    text:
                      type: string
                      description: What is posted, with its " k/n" counter.
                    media:
                      type: array
                      description: Indexes into `content.media`.
                      items:
                        type: integer
                    range:
                      type: array
                      minItems: 2
                      maxItems: 2
                      description: The code points of `text` (the target's) the post carries, counter excluded. A media-only post's is empty, at the end.
                      items:
                        type: integer
                    break:
                      type: string
                      enum: [none, manual, auto]
                      description: What starts the post; `none` for the first.
                    length:
                      type: integer
                      description: The post as the destination counts it.
                    problems:
                      type: array
                      description: What the destination would refuse about this post (such as too many links); a post with any is refused.
                      items:
                        type: string
              link_card:
                description: The card this account gets, on item `item`; null for none.
                oneOf:
                  - type: "null"
                  - type: object
                    additionalProperties: false
                    required: [item, url, title, description]
                    properties:
                      item:
                        type: integer
                      url:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      thumb_url:
                        type: string
              warnings:
                type: array
                items:
                  type: string
              media_notes:
                type: array
                description: Media that will be converted to fit this account.
                items:
                  type: object
                  additionalProperties: false
                  required: [media, note]
                  properties:
                    media:
                      type: integer
                    note:
                      type: string
    TranslateIn:
      type: object
      additionalProperties: false
      required: [text, target_lang]
      properties:
        text:
          type: string
          maxLength: 50000
        target_lang:
          type: string
          description: An ISO 639-1 code DeepL translates into, such as `fr`.
          examples: [fr]
    Translation:
      type: object
      additionalProperties: false
      required: [text, detected_source_language]
      properties:
        text:
          type: string
        detected_source_language:
          type: string
          description: ISO 639-1, as DeepL detected it.
    VerifyIn:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: string
          description: A Nostr event's JSON, a post URL, or an at:// URI.
        platform:
          type: string
          enum: [nostr, bluesky, mastodon, threads]
          description: Leave it out to detect the platform from `input`.
        expected:
          type: string
          maxLength: 500
          description: An identity to match the signer against (an npub, handle, DID or acct).
    Verdict:
      type: object
      additionalProperties: false
      required: [platform, status, checks]
      properties:
        platform:
          type: string
        status:
          type: string
          enum: [verified, failed, error]
        assurance:
          type: string
          enum: [cryptographic, origin]
          description: "`cryptographic`: a signature checked against the key; `origin`: the post was fetched from the server that hosts its author."
        signer:
          type: object
          additionalProperties: false
          properties:
            pubkey_hex:
              type: string
            npub:
              type: string
            did:
              type: string
            handle:
              type: string
            handle_verified:
              type: boolean
            pds:
              type: string
            actor_uri:
              type: string
            acct:
              type: string
            origin_host:
              type: string
        expected:
          type: object
          additionalProperties: false
          required: [provided, matches]
          properties:
            provided:
              type: string
            matches:
              type: boolean
            detail:
              type: string
        content:
          type: object
          additionalProperties: false
          properties:
            text:
              type: string
            created_at:
              type: string
            kind:
              type: string
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, result]
            properties:
              name:
                type: string
              result:
                type: string
                enum: [pass, fail, skip]
              detail:
                type: string
        warnings:
          type: array
          items:
            type: string
        error:
          type: string
          description: Why the check could not complete (status `error`).
    NostrRelays:
      type: object
      additionalProperties: false
      required: [home, nip65, secondary, targets, nip65_error]
      properties:
        home:
          type: string
          description: The relay the others are compared with.
        nip65:
          type: array
          description: The write relays your profile lists, read from relays.
          items:
            type: string
        secondary:
          type: array
          description: The relays added on this server.
          items:
            type: string
        targets:
          type: array
          description: The relays a scan or sync goes through, in order.
          items:
            type: object
            additionalProperties: false
            required: [url, group]
            properties:
              url:
                type: string
              group:
                type: string
                enum: [nip65, secondary]
        nip65_error:
          type: ["string", "null"]
          description: Why the NIP-65 relays couldn't be read (they are then missing from `nip65` and `targets`); null when they were.
    NostrRelaysIn:
      type: object
      additionalProperties: false
      required: [secondary]
      properties:
        secondary:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 512
    RelaySelection:
      type: object
      additionalProperties: false
      properties:
        relays:
          type: array
          description: Only these targets (all of them when left out or empty).
          items:
            type: string
    RelaySyncIn:
      type: object
      additionalProperties: false
      required: [direction]
      properties:
        direction:
          type: string
          enum: [pull, push]
        relays:
          type: array
          description: Only these targets (all of them when left out or empty).
          items:
            type: string
    RelayScan:
      type: object
      additionalProperties: false
      required: [url, group, missing_at_home, missing_at_relay, status]
      properties:
        url:
          type: string
        group:
          type: string
          enum: [nip65, secondary]
        missing_at_home:
          type: integer
        missing_at_relay:
          type: integer
        status:
          type: string
          enum: [ok, unreachable, auth, error]
        message:
          type: string
    RelaySyncResult:
      type: object
      additionalProperties: false
      required: [url, direction, published, failed, status]
      properties:
        url:
          type: string
        direction:
          type: string
          enum: [pull, push]
        published:
          type: integer
        failed:
          type: integer
        status:
          type: string
          enum: [ok, partial, unreachable, auth, error]
          description: "`partial`: some events were accepted and some refused (see `message`)."
        message:
          type: string
    PublicFeed:
      type: object
      additionalProperties: false
      required: [version, generated_at, posts]
      properties:
        version:
          type: integer
          const: 1
        generated_at:
          type: string
          format: date-time
        posts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, published_at, text, links]
            properties:
              id:
                type: string
              published_at:
                type: string
                format: date-time
              text:
                type: string
              media:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [url, mime]
                  properties:
                    url:
                      type: string
                    mime:
                      type: string
                    alt:
                      type: string
                    dim:
                      type: string
                    blurhash:
                      type: string
              interaction:
                type: object
                additionalProperties: false
                required: [action, source_platform, source_url, source_author]
                properties:
                  action:
                    type: string
                    enum: [quote, repost]
                  source_platform:
                    type: string
                  source_url:
                    type: string
                  source_author:
                    type: string
              links:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [platform, url]
                  properties:
                    platform:
                      type: string
                    url:
                      type: string
                    account:
                      type: string
                      description: The id of the account that posted it (absent for posts from before accounts had ids).
                    handle:
                      type: string
                      description: That account's handle as last seen; absent until its network first answered.
    ResolvedSource:
      type: object
      additionalProperties: false
      required: [platform, url, author, text, media, created_at, account, actions]
      properties:
        platform:
          type: string
        url:
          type: string
        author:
          type: object
          additionalProperties: false
          required: [name, handle]
          properties:
            name:
              type: string
            handle:
              type: string
        text:
          type: string
        media:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [url, alt, type]
            properties:
              url:
                type: string
              alt:
                type: string
              type:
                type: string
                enum: [image, video]
                description: A link-quote copies images only.
        created_at:
          $ref: "#/components/schemas/NullableTimestamp"
        account:
          type: ["string", "null"]
          description: |
            The account that looked the post up: the one asked for, else
            your first connected account on the post's network; null when
            you have none.
        actions:
          type: object
          additionalProperties: false
          required: [reply, quote, repost]
          properties:
            reply:
              $ref: "#/components/schemas/ActionAvailability"
            quote:
              $ref: "#/components/schemas/ActionAvailability"
            repost:
              $ref: "#/components/schemas/ActionAvailability"
    ActionAvailability:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          description: |
            Why not, when not allowed. An allowed action may have one too, as
            a note (a Mastodon quote that needs the author's approval lands
            pending); `POST /v1/posts:preview` repeats it as a warning.
    MediaObject:
      type: object
      additionalProperties: false
      required: [id, status, mime, alt, url, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^med_"
        status:
          type: string
          enum: [processing, ready, failed]
        mime:
          type: string
        alt:
          type: string
        url:
          type: ["string", "null"]
          description: The file in media storage; null until it is ready.
        sha256:
          type: string
        size_bytes:
          type: integer
        dim:
          type: string
          description: WIDTHxHEIGHT.
        blurhash:
          type: string
        duration_secs:
          type: integer
        poster_url:
          type: string
        error:
          type: string
          description: Why processing failed.
        processing:
          type: object
          additionalProperties: false
          required: [stage, progress]
          properties:
            stage:
              type: string
            progress:
              type: number
              minimum: 0
              maximum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    MediaPatch:
      type: object
      additionalProperties: false
      required: [alt]
      properties:
        alt:
          type: string
          maxLength: 10000
    PostMedia:
      type: object
      additionalProperties: false
      required: [url, mime]
      properties:
        url:
          type: string
        mime:
          type: string
        alt:
          type: string
        sha256:
          type: string
        size_bytes:
          type: integer
        dim:
          type: string
          description: WIDTHxHEIGHT.
        blurhash:
          type: string
        duration_secs:
          type: integer
        poster_url:
          type: string
    TargetStatus:
      type: string
      enum: [scheduled, publishing, published, partial, failed, canceled, missed]
    Target:
      type: object
      description: One account the post goes to. Items and attempts are in a single post's view only.
      additionalProperties: false
      required: [id, account, type, status, gave_up_at]
      properties:
        id:
          type: string
          pattern: "^tgt_"
        account:
          type: string
          pattern: "^acc_"
        type:
          type: string
          description: The destination type.
        status:
          $ref: "#/components/schemas/TargetStatus"
        error_class:
          type: string
          description: The class of the latest failure (transient, rate_limited, auth, invalid, unknown, …).
        gave_up_at:
          description: When automatic retries stopped; a retry by hand starts them again.
          $ref: "#/components/schemas/NullableTimestamp"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
    ItemStatus:
      type: string
      enum: [planned, sending, published, partial, failed, unknown, canceled]
      description: "`unknown`: a send was in flight when the server stopped, and whether it went out is not known."
    Item:
      type: object
      description: One post the target makes (one, or one per thread part).
      additionalProperties: false
      required: [ordinal, status, text, media, attempts, next_attempt_at, published_at, deliveries]
      properties:
        ordinal:
          type: integer
        status:
          $ref: "#/components/schemas/ItemStatus"
        text:
          type: string
        media:
          type: array
          description: Indexes into the post's content.media.
          items:
            type: integer
        range:
          type: array
          minItems: 2
          maxItems: 2
          description: The code points of the target's text this item posts (counter excluded); absent on items posted before 2.1.
          items:
            type: integer
        url:
          type: string
        remote_id:
          type: string
        error:
          type: string
        error_class:
          type: string
        attempts:
          type: integer
        next_attempt_at:
          description: When the engine sends it next; null when nothing is planned.
          $ref: "#/components/schemas/NullableTimestamp"
        published_at:
          $ref: "#/components/schemas/NullableTimestamp"
        deliveries:
          type: array
          description: Per-endpoint results, for destinations that deliver to several (Nostr relays).
          items:
            $ref: "#/components/schemas/Delivery"
    Delivery:
      type: object
      additionalProperties: false
      required: [endpoint, status, retries, attempted_at, gave_up_at]
      properties:
        endpoint:
          type: string
        status:
          type: string
          enum: [ok, failed, skipped, pending]
        message:
          type: string
        retries:
          type: integer
        attempted_at:
          $ref: "#/components/schemas/NullableTimestamp"
        gave_up_at:
          $ref: "#/components/schemas/NullableTimestamp"
    Attempt:
      type: object
      additionalProperties: false
      required: [number, status, latency_ms, attempted_at]
      properties:
        number:
          type: integer
        status:
          type: string
        error:
          type: string
        error_class:
          type: string
        latency_ms:
          type: integer
        attempted_at:
          $ref: "#/components/schemas/Timestamp"
    PostPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        schedule:
          type: object
          additionalProperties: false
          required: [at]
          properties:
            at:
              type: string
              format: date-time
        hidden:
          type: boolean
    RetryRequest:
      type: object
      additionalProperties: false
      properties:
        targets:
          type: array
          items:
            type: string
            pattern: "^tgt_"
        deliveries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [target, endpoint]
            properties:
              target:
                type: string
                pattern: "^tgt_"
              endpoint:
                type: string
    ResolveItemRequest:
      type: object
      additionalProperties: false
      required: [target, ordinal, outcome]
      properties:
        target:
          type: string
          pattern: "^tgt_"
          description: The item's target.
        ordinal:
          type: integer
          minimum: 0
          maximum: 99
          description: The item's place in its target, from 0.
        outcome:
          type: string
          enum: [published, not_published]
        url:
          type: string
          maxLength: 2048
          description: The live post's URL; only with `published`.
    Event:
      type: object
      description: |
        The `data` of one server-sent event. Types: `post.created`,
        `post.updated` (status, schedule or visibility), `post.completed`
        (nothing left to send), `item.sending`, `item.waiting` (put back
        unsent because its account is locked: status `planned`, `error`
        says why), `item.published`, `item.partial`, `item.failed`,
        `item.unknown`, `item.canceled`, `delivery.updated`, and
        `account.updated` (your settings on an
        account changed: `account`, `destination`, `fields`, `actor`, and
        `token` when a token made the change; no `post`). Fields are
        present as the type needs.
      additionalProperties: false
      required: [id, type, created_at]
      properties:
        id:
          type: integer
        type:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        post:
          type: string
          pattern: "^pst_"
          description: The post; absent for an account event.
        status:
          type: string
          description: The post's status for post events; the item's or delivery's otherwise.
        target:
          type: string
        account:
          type: string
        destination:
          type: string
        ordinal:
          type: integer
        url:
          type: string
        error_class:
          type: string
        error:
          type: string
        endpoint:
          type: string
        scheduled_at:
          $ref: "#/components/schemas/Timestamp"
        hidden:
          type: boolean
        fields:
          type: array
          items:
            type: string
            enum: [label, enabled, default_selected, public_feed]
          description: An account event's changed fields, by name (never their values).
        actor:
          type: string
          enum: [session, token, proxy]
          description: Who made an account change.
        token:
          type: string
          pattern: "^tok_"
          description: The token that made an account change.
    Problem:
      type: object
      description: An RFC 9457 problem with a stable `code`. Clients should ignore members they don't know (RFC 9457 §3.2).
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: This error's entry in the error catalogue.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: The request path.
        code:
          type: string
          enum:
            - not_found
            - method_not_allowed
            - unauthenticated
            - insufficient_scope
            - cross_origin
            - misdirected
            - invalid_json
            - unsupported_media_type
            - too_large
            - validation_failed
            - invalid_parameter
            - invalid_cursor
            - invalid_state
            - idempotency_key_invalid
            - idempotency_key_in_use
            - idempotency_key_reused
            - precondition_failed
            - unreadable_upload
            - unavailable
            - upstream_failed
            - insufficient_storage
            - internal
            - rate_limited
            - reauth_required
            - session_required
            - sign_in_required
            - last_sign_in_method
            - gone
            - credentials_rejected
            - duplicate_account
            - locked_by_env
            - identity_changed
            - master_key_required
            - master_key_mismatch
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        operation:
          type: string
          description: "`reauth_required` only: the operation to re-authenticate for (`signin.add`, `signin.remove`, `password.set`, `token.create`, `account.delete`, `account.reveal`)."
        target:
          type: string
          description: "`reauth_required` only, for an operation on one account (`account.delete`, `account.reveal`): its id, to re-authenticate for as `target`."
        account_id:
          type: string
          description: "`duplicate_account` only: the account you already have."
    FieldError:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer into the request body.
        parameter:
          type: string
          description: A query parameter's name.
        code:
          type: string
        detail:
          type: string
    NextCursor:
      description: The cursor for the next page; null on the last page.
      type: [string, "null"]
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, "null"]
      format: date-time
    Scope:
      type: string
      description: |
        `admin` includes every scope listed before `accounts:write`. Scopes
        added since must be granted by name. Only the signed-in owner, just
        re-authenticated, can create a token holding `admin` or
        `accounts:write`.
      enum: ["posts:read", "posts:write", "media:write", "drafts:read", "drafts:write", "accounts:read", "accounts:write", admin]
    Instance:
      type: object
      additionalProperties: false
      required: [version, auth, features, user_languages, translate_targets, limits, idempotency, scopes, destinations, pagination, secrets]
      properties:
        version:
          type: string
          description: The server build ("dev" for a local build).
        auth:
          type: string
          enum: [oidc, local, proxy]
          description: |
            How the owner signs in. `oidc`: through an identity provider.
            `local`: with a passkey or password kept by this server.
            `proxy`: the server has no sign-in of its own; the reverse proxy
            in front is the gate.
        sign_in_recommended:
          type: boolean
          description: |
            Present (true) in `proxy` mode: the web app offers to set up
            sign-in, without which credentials can't be managed in the app.
        features:
          type: object
          additionalProperties: false
          required: [media, translate, video, public_feed, relay_sync]
          properties:
            media:
              type: boolean
              description: |
                A media store is configured (`BLOSSOM_URL`), so posts can
                carry images and videos. Without one, uploads answer `503`.
            translate:
              type: boolean
              description: DeepL translation is configured.
            video:
              type: boolean
              description: A media store is configured and ffmpeg is present, so video can be processed.
            public_feed:
              type: boolean
              description: The public feed has a token.
            relay_sync:
              type: boolean
              description: Nostr relay-list sync is available (a Nostr account of yours is connected).
        user_languages:
          type: array
          description: The operator's languages (ISO 639-1), in preference order.
          items:
            type: string
        translate_targets:
          type: array
          description: The user languages translation can target; empty without translation.
          items:
            type: string
        limits:
          type: object
          additionalProperties: false
          required: [max_json_body_bytes, max_upload_bytes, max_video_upload_bytes, max_images_per_request, max_idempotency_key_length]
          properties:
            max_json_body_bytes:
              type: integer
            max_upload_bytes:
              type: integer
            max_video_upload_bytes:
              type: integer
            max_images_per_request:
              type: integer
            max_idempotency_key_length:
              type: integer
        idempotency:
          type: object
          additionalProperties: false
          required: [ttl_secs]
          properties:
            ttl_secs:
              type: integer
              description: How long an Idempotency-Key is remembered.
        scopes:
          type: array
          description: The scopes a token can hold.
          items:
            $ref: "#/components/schemas/Scope"
        destinations:
          type: array
          description: The registered destination types.
          items:
            type: string
        pagination:
          type: object
          additionalProperties: false
          required: [default_limit, max_limit]
          properties:
            default_limit:
              type: integer
            max_limit:
              type: integer
        secrets:
          type: object
          description: |
            The master key's status. `none`: no key, so accounts come from the
            environment only; `ok`: credentials can be saved; `missing`: saved
            credentials need the key; `mismatch`: they were saved with another key
            (or a rotation failed). Until it is `ok`, accounts added in the app
            that can't be opened are `locked` and saving a credential is refused.
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [none, ok, missing, mismatch]
            detail:
              type: string
              description: What to do, for the operator.
    Manifest:
      type: object
      description: A destination type, the same for every account of it.
      additionalProperties: false
      required: [contract, type, name, kinds, defaults, auth]
      properties:
        contract:
          type: integer
          description: The destination contract version the driver speaks.
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        name:
          type: string
        kinds:
          type: array
          items:
            type: string
            enum: [note, article]
        options:
          type: array
          description: The type's own settings, for a UI to render and the server to validate.
          items:
            $ref: "#/components/schemas/OptionSpec"
        defaults:
          $ref: "#/components/schemas/Capabilities"
        auth:
          type: array
          description: The ways to connect an account of the type, most recommended first.
          items:
            $ref: "#/components/schemas/AuthMethod"
        config:
          type: array
          description: An account's configuration (never a credential).
          items:
            $ref: "#/components/schemas/FieldSpec"
        instance_config:
          type: array
          description: Configuration the type needs once per server, set by the operator.
          items:
            $ref: "#/components/schemas/FieldSpec"
    AuthMethod:
      type: object
      additionalProperties: false
      required: [id, flow, label]
      properties:
        id:
          type: string
          description: The method's id, kept with the account as `auth_method`.
        flow:
          type: string
          enum: [fields, redirect, generate]
          description: "`fields`: the owner types the credential; `redirect`: they sign in at the network; `generate`: Publisher makes it."
        label:
          type: string
        help:
          type: string
        help_url:
          type: string
          format: uri
        fields:
          type: array
          description: What the owner types. A `secret` field becomes a credential; the others join the account's config.
          items:
            $ref: "#/components/schemas/FieldSpec"
        needs_instance_config:
          type: array
          items:
            type: string
        needs_public_url:
          type: boolean
    FieldSpec:
      type: object
      additionalProperties: false
      required: [key, label, type]
      properties:
        key:
          type: string
        label:
          type: string
        help:
          type: string
        type:
          type: string
          enum: [string, text, bool, int, enum, string_list, url, url_list]
        secret:
          type: boolean
          description: A credential, stored encrypted and never shown again.
        revealable:
          type: boolean
          description: A credential the owner may see again (`:reveal`), such as a Nostr key.
        audience:
          type: boolean
          description: Where the credentials are sent; changing it needs them again.
        required:
          type: boolean
        pattern:
          type: string
          description: An RE2 expression the whole value must match.
        placeholder:
          type: string
        enum:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string
        default:
          description: The value a new account gets when the field is left out.
        min:
          type: integer
        max:
          type: integer
        max_length:
          type: integer
          description: In characters; 4096 when absent.
        max_items:
          type: integer
          description: For a list; 64 when absent.
        url:
          type: object
          description: What a `url` or `url_list` field takes. `plain` only for a private host the operator allows (PRIVATE_DESTINATIONS).
          additionalProperties: false
          required: [secure]
          properties:
            secure:
              type: string
            plain:
              type: string
            path:
              type: boolean
        advanced:
          type: boolean
    OptionSpec:
      type: object
      additionalProperties: false
      required: [key, type, label]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [bool, string, int, enum, enum_list]
        enum:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value:
                type: string
                description: '"" means the default.'
              label:
                type: string
        label:
          type: string
        help:
          type: string
        min:
          type: integer
        max:
          type: integer
    Capabilities:
      type: object
      description: What an account can do. Zero limits mean no limit.
      additionalProperties: false
      required: [text, title, threading, media, link_preview, content_warning, sensitive, languages, interactions, idempotent]
      properties:
        text:
          type: object
          additionalProperties: false
          required: [max_length, counting]
          properties:
            max_length:
              type: integer
            max_links:
              type: integer
              description: The most distinct URLs one post may hold (Threads 5); absent means no cap.
            counting:
              type: object
              additionalProperties: false
              required: [unit]
              properties:
                unit:
                  type: string
                  description: graphemes, codepoints, utf16 or bytes ("" means graphemes).
                url_length:
                  type: integer
                  description: The fixed cost of every URL, when the network has one.
                mention_local_part_only:
                  type: boolean
                  description: A remote mention (@user@host) counts as @user.
                emoji_utf8_bytes:
                  type: boolean
                  description: An emoji counts as its UTF-8 length (Threads).
                content_warning_counts:
                  type: boolean
                  description: The content warning counts toward the limit of every post it goes with (Mastodon).
        title:
          type: object
          additionalProperties: false
          required: [supported, required]
          properties:
            supported:
              type: boolean
            required:
              type: boolean
            max_length:
              type: integer
        threading:
          type: object
          additionalProperties: false
          required: [supported]
          properties:
            supported:
              type: boolean
            max_items:
              type: integer
        media:
          type: object
          additionalProperties: false
          required: [transport, images, video, mix_images_video, alt_text]
          properties:
            transport:
              type: string
              enum: [bytes, url]
            images:
              $ref: "#/components/schemas/MediaLimit"
            video:
              $ref: "#/components/schemas/MediaLimit"
            mix_images_video:
              type: boolean
            alt_text:
              type: boolean
            alt_max_length:
              type: integer
        link_preview:
          type: string
          enum: [none, server, client]
        content_warning:
          type: boolean
        sensitive:
          type: boolean
        languages:
          type: integer
          description: How many language tags a post can carry.
        visibility:
          type: array
          items:
            type: string
        interactions:
          type: object
          additionalProperties: false
          required: [reply, quote, repost, quote_video]
          properties:
            reply:
              type: boolean
            quote:
              type: boolean
            repost:
              type: boolean
            quote_video:
              type: boolean
              description: A native quote can carry a video.
        idempotent:
          type: string
          enum: [none, key, natural]
          description: How a repeated publish of one item behaves on the network.
        idempotency_key_ttl_secs:
          type: integer
    MediaLimit:
      type: object
      additionalProperties: false
      required: [supported]
      properties:
        supported:
          type: boolean
        max_count:
          type: integer
        max_bytes:
          type: integer
        max_pixels:
          type: integer
        mimes:
          type: array
          items:
            type: string
        max_aspect:
          type: number
          description: The widest long-edge to short-edge ratio an image may have (Threads 10).
        max_duration_secs:
          type: integer
        advisory_duration_secs:
          type: integer
    Account:
      type: object
      additionalProperties: false
      required: [id, type, label, source, enabled, status, order, default_selected, public_feed, config, credentials, created_at, updated_at]
      description: |
        One of your accounts. The profile fields (`handle`,
        `display_name`, `avatar`, `profile_url`) are as the network last
        reported them: reading never waits on the network, and a stale
        profile is fetched in the background for the next read.
      properties:
        id:
          type: string
          pattern: "^acc_"
        type:
          type: string
          description: The destination type.
        label:
          type: string
        handle:
          type: string
        display_name:
          type: string
        avatar:
          type: string
          format: uri
          description: An absolute http(s) URL; absent when the profile has none.
        profile_url:
          type: string
          format: uri
          description: The account's page on its network (absolute http(s)); absent when unknown.
        remote_id:
          type: string
          description: |
            The account's stable id on its network (a DID, an account URL,
            a user id, a public key); absent until the network was first
            asked.
        source:
          type: string
          enum: [env, db]
          description: |
            Where the account is configured: `env` (environment variables,
            changed there) or `db` (added or adopted in the app).
        enabled:
          type: boolean
          description: Your switch; `status` says whether it can be used.
        status:
          type: string
          enum: [connected, disabled, not_configured, locked, needs_reconnect, deleted]
          description: |
            Whether the account can be used now. `connected`: yes.
            `disabled`: you turned it off. `not_configured`: its variables
            are no longer set, its settings can't be used, or this version
            has no driver for its network. `locked`: its saved state can't
            be read now. `needs_reconnect`: the network refused its
            credentials. A send to a locked account waits; to any other
            account that isn't connected it fails, and can be retried once
            the account is connected.
        status_reason:
          type: string
          description: Why it isn't connected, and what to do; absent when connected.
        order:
          type: integer
          description: |
            Its place in the app's order (networks in a fixed order, then
            oldest first); tabs and target rows follow it. Lists are by
            creation time, so sort by this to show them. `-1` for an
            account this server hasn't loaded yet (restart to load it).
        default_selected:
          type: boolean
          description: The composer selects it for a new post.
        public_feed:
          type: boolean
          description: Its posts appear in the public feed.
        capabilities:
          description: Absent when this server has no driver for the account's type, and on a deleted account.
          $ref: "#/components/schemas/Capabilities"
        auth_method:
          type: string
          description: How it connects (`GET /v1/destinations` lists the methods).
        config:
          type: object
          description: |
            Its configuration: the type's fields and the method's fields
            that aren't secret (state the account keeps for itself, such
            as a token's expiry, is left out).
        credentials:
          type: object
          description: Which credentials are set, and when; never what they are.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [set]
            properties:
              set:
                type: boolean
              updated_at:
                $ref: "#/components/schemas/Timestamp"
        locked_fields:
          type: array
          description: The fields environment variables set (`source` `env`); change them there, or adopt the account.
          items:
            type: string
        health:
          type: object
          additionalProperties: false
          required: [ok, reachable, checked_at]
          description: The last authenticated check (absent before one ran).
          properties:
            ok:
              type: boolean
            reachable:
              type: boolean
              description: The network answered at all.
            auth_ok:
              type: boolean
              description: Whether the credentials work, when the network said.
            message:
              type: string
            expires_at:
              $ref: "#/components/schemas/Timestamp"
            checked_at:
              $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        deleted_at:
          $ref: "#/components/schemas/Timestamp"
    AccountCreate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          description: The network (`GET /v1/destinations`).
        label:
          type: string
          maxLength: 64
          description: Your name for it; the network's name when left out.
        method:
          type: string
          description: How it connects; may be left out when the type has one.
        config:
          type: object
          description: The type's fields.
        credentials:
          type: object
          description: The method's fields (a `generate` method has none).
    AccountPatch:
      type: object
      additionalProperties: false
      description: Your settings on an account; send only what changes.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
        enabled:
          type: boolean
        default_selected:
          type: boolean
        public_feed:
          type: boolean
        method:
          type: string
          description: A new way of connecting (an account added in the app); needs `credentials`.
        config:
          type: object
          description: A merge patch of the configuration (an account added in the app); `null` puts a field back to its default.
        credentials:
          type: object
          description: Every credential of the method, replacing the stored ones (an account added in the app).
    Token:
      type: object
      additionalProperties: false
      required: [id, name, scopes, status, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          pattern: "^tok_"
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/NullableTimestamp"
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        revoked_at:
          $ref: "#/components/schemas/NullableTimestamp"
    CreatedToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, status, created_at, last_used_at, expires_at, revoked_at, secret]
      properties:
        id:
          type: string
          pattern: "^tok_"
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          type: "null"
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        revoked_at:
          type: "null"
        secret:
          type: string
          description: The bearer value. Shown once; store it now.
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            What the token is for, such as the script that uses it. Trimmed;
            at least one visible character, and no control, formatting or
            invisible characters.
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the token stops working, kept to the second; omit or null for never.
      examples:
        - name: n8n cross-posting
          scopes: ["posts:write", "media:write"]
          expires_at: "2027-11-05T00:00:00Z"
    SignIn:
      type: object
      additionalProperties: false
      required: [mode, passkeys, password, passkeys_available]
      properties:
        mode:
          type: string
          enum: [oidc, local, proxy]
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        password:
          type: object
          additionalProperties: false
          required: [set, updated_at]
          properties:
            set:
              type: boolean
            updated_at:
              $ref: "#/components/schemas/NullableTimestamp"
        passkeys_available:
          type: boolean
          description: Passkeys can be added here (`local` mode with `PUBLIC_URL`).
    Passkey:
      type: object
      additionalProperties: false
      required: [id, name, created_at, last_used_at, synced, usable, rp_id]
      properties:
        id:
          type: string
          pattern: "^pk_"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/NullableTimestamp"
        synced:
          type: boolean
          description: The passkey may be copied to the owner's other devices (backup eligible).
        usable:
          type: boolean
          description: |
            Made for this address. False: made for another one (`PUBLIC_URL`
            changed since), so it can't sign in here; it doesn't count as a
            way to sign in.
        rp_id:
          type: string
          description: The host the passkey was made for.
    PasskeyOptions:
      type: object
      description: |
        `PublicKeyCredentialCreationOptions` (or, for a sign-in,
        `PublicKeyCredentialRequestOptions`) under `publicKey`, binary
        members base64url-encoded, ready for `PublicKeyCredential.parse…FromJSON()`.
      additionalProperties: true
      required: [publicKey]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          required: [challenge]
          properties:
            challenge:
              type: string
    PasskeyFinish:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        name:
          type: string
          description: What to call it ("Passkey" when empty).
        credential:
          type: object
          additionalProperties: true
          description: The browser's `PublicKeyCredential.toJSON()`.
    Session:
      type: object
      additionalProperties: false
      required: [id, current, method, user_agent, addr, created_at, last_seen_at, expires_at]
      properties:
        id:
          type: string
          pattern: "^ses_"
        current:
          type: boolean
          description: The session making this request.
        method:
          type: string
          description: How it signed in (`passkey`, `password`, `setup`, `oidc`).
        user_agent:
          type: string
          description: The browser's User-Agent when it signed in, cut to 200 characters.
        addr:
          type: string
          description: The address it signed in from.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          description: Updated at most once a minute.
          $ref: "#/components/schemas/NullableTimestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    SignInEvent:
      type: object
      additionalProperties: false
      required: [id, type, created_at]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [login.succeeded, login.failed, signin.added, signin.removed, signin.changed, token.created]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        method:
          type: string
          description: "`passkey`, `password`, `setup` or `oidc`."
        addr:
          type: string
        passkey:
          type: string
          description: The passkey's id.
        token:
          type: string
          description: The token's id (`token.created`).
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
    Me:
      type: object
      additionalProperties: false
      required: [kind, scopes]
      properties:
        kind:
          type: string
          enum: [session, token, proxy]
          description: "`session`: signed in. `token`: a bearer token. `proxy`: the server has no sign-in of its own (`AUTH_MODE=proxy`) and the reverse proxy let the request through."
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        user:
          type: object
          description: The signed-in person (sessions only).
          additionalProperties: false
          required: [id, subject]
          properties:
            id:
              type: string
            subject:
              type: string
            email:
              type: string
            name:
              type: string
        token:
          $ref: "#/components/schemas/Token"
