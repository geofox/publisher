openapi: 3.1.0
info:
  title: Publisher API
  version: "1"
  summary: Publish to Nostr, Bluesky, Mastodon, Threads and more from one place.
  description: |
    The `/v1` API of a self-hosted Publisher server. The web app uses it too.

    **Conventions**

    - JSON in and out, snake_case, RFC 3339 UTC timestamps, prefixed ids
      (`acc_`, `tok_`, `pst_`, `tgt_`, `med_`, `drf_`).
    - Errors are RFC 9457 problem details (`application/problem+json`) with a
      stable `code`; see the [error catalogue](https://github.com/geofox/publisher/blob/main/docs/api/errors.md).
    - Lists take `?limit=` (1–200, default 50) and `?cursor=`, and answer
      `{"data": [...], "next_cursor": "..."}`; `next_cursor` is null on the
      last page. Cursors are opaque.
    - Creates marked as such honor `Idempotency-Key`
      (draft-ietf-httpapi-idempotency-key-header-08): a repeat with the same
      body gets the first response again, with `Idempotent-Replayed: true`;
      a different body with the same key gets `422 idempotency_key_reused`;
      a repeat while the first is running gets `409 idempotency_key_in_use`.
      Keys are kept 24 hours, per caller.
    - Responses are `Cache-Control: no-store`.

    **Authentication**

    Send `Authorization: Bearer <token>`, or use the browser session the web
    app signs in with. A bearer header wins over a session cookie. Tokens
    carry scopes; each operation names the one it needs (`admin` includes
    every scope). A session can do everything. When the server runs without
    OIDC, the reverse proxy in front of it is the gate and every request
    has every scope (a bearer token, if sent, is still checked).
  license:
    name: See the repository
    url: https://github.com/geofox/publisher
servers:
  - url: /
security:
  - bearer: []
  - session: []
tags:
  - name: instance
    description: The server and what it can do.
  - name: accounts
    description: Destination types and the accounts that publish to them.
  - name: tokens
    description: API tokens and the caller's identity.
  - name: posts
    description: Posts and what became of them on each account.
  - name: media
    description: Images and videos uploaded once and named by id in posts.
  - name: drafts
    description: Posts being written, saved to finish later.
  - name: events
    description: Server-sent event streams of what happens to posts.
  - name: tools
    description: Translation, signature checks, Nostr relay sync and the public feed.
paths:
  /v1/openapi.json:
    get:
      operationId: getOpenAPI
      tags: [instance]
      summary: This document, as JSON
      security: []
      responses:
        "200":
          description: The OpenAPI description.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Problem"
  /v1/instance:
    get:
      operationId: getInstance
      tags: [instance]
      summary: Version, features, languages and limits
      description: Any authenticated caller.
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/destinations:
    get:
      operationId: listDestinations
      tags: [accounts]
      summary: Registered destination types and their manifests
      description: Needs `accounts:read`. Not paginated (a handful of types).
      security:
        - bearer: ["accounts:read"]
        - session: []
      responses:
        "200":
          description: Every registered type, sorted by type.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Manifest"
                  next_cursor:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: The owner's accounts, oldest first
      description: Needs `accounts:read`. Disabled accounts are listed too (they keep their history).
      security:
        - bearer: ["accounts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: One account
      description: Needs `accounts:read`.
      security:
        - bearer: ["accounts:read"]
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            examples: [acc_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      tags: [tokens]
      summary: Who is calling, and with which scopes
      description: Any authenticated caller.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: API tokens, newest first
      description: Needs `admin`. Revoked and expired tokens are listed with their status.
      security:
        - bearer: [admin]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a token
      description: |
        Needs `admin`. The response carries the token's `secret`, the only
        time it is shown: the server keeps only a hash.

        A token creating a token must give it an expiry no later than its
        own (`422 exceeds_caller`).

        Not idempotent, deliberately: replaying the response would mean
        storing the secret. A retried create makes a second token; revoke
        the one you did not keep.
      security:
        - bearer: [admin]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: The token, with its secret.
          headers:
            Location:
              description: The token's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          examples: [tok_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    get:
      operationId: getToken
      tags: [tokens]
      summary: One token (never its secret)
      description: Needs `admin`.
      security:
        - bearer: [admin]
        - session: []
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke a token
      description: |
        Needs `admin`. Takes effect at once. Revoking a revoked token
        succeeds too, so a retried call gets the same answer. The token
        stays listed, with status `revoked`.
      security:
        - bearer: [admin]
        - session: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: Posts, newest first
      description: |
        Needs `posts:read`. Hidden posts are left out unless `hidden=true`,
        which lists only hidden ones. Targets come without items or
        attempts; get a post for those.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Comma-separated post statuses to keep.
          schema:
            type: string
            examples: ["failed,needs_attention"]
        - name: account
          in: query
          description: Keep posts with a target on this account.
          schema:
            type: string
            pattern: "^acc_"
        - name: q
          in: query
          description: Keep posts whose text contains this.
          schema:
            type: string
        - name: since
          in: query
          description: Keep posts created at or after this time.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Keep posts created before this time.
          schema:
            type: string
            format: date-time
        - name: hidden
          in: query
          description: true lists hidden posts instead of shown ones.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of posts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPost
      tags: [posts]
      summary: Publish or schedule a post
      description: |
        Needs `posts:write`. Shared `content` goes to every account in
        `targets`; each target can override the text, content warning,
        sensitivity and languages, and set its destination's `options`
        (listed by `GET /v1/destinations`, plus `visibility` where the
        account's capabilities list values). Media are named by id, from
        `POST /v1/media`, and must be `ready`. Text too long for an account
        is split into a thread there (`threading.numbering` adds 1/n
        counters); `POST /v1/posts:preview` shows the split.

        The post is saved before anything is sent, then the engine sends
        it. The answer is `202` at once, with the post `publishing` (or
        `scheduled`, with `schedule.at`). With `Prefer: wait=N` (seconds,
        at most 60) it waits until the post settles and answers `201`
        with the outcome, or `202` if it has not settled by then;
        `Preference-Applied` says the wait was honored. A scheduled post
        does not wait. `reply_to`, `quote` or `repost` (see SourceIn) make
        the post an interaction with another post. Idempotent: send an `Idempotency-Key` so a retried
        request can't post twice. While a request waits, a retry with its
        key gets `409 idempotency_key_in_use`; `Prefer` is not part of the
        request's identity, so a retry that adds a wait gets the first
        answer back without waiting.
      security:
        - bearer: ["posts:write"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Prefer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "201":
          description: The post, settled within the wait.
          headers:
            Location:
              description: The post's URL.
              schema:
                type: string
            Preference-Applied:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "202":
          description: The post, saved; the engine is sending it (or will, when scheduled).
          headers:
            Location:
              description: The post's URL.
              schema:
                type: string
            Preference-Applied:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts:preview:
    post:
      operationId: previewPost
      tags: [posts]
      summary: Plan a post without sending it
      description: |
        Needs `posts:write`. Takes the body of `POST /v1/posts`, validates it
        the same way and answers what each account would get: its thread
        items with the media each carries, the link card (fetched with a
        short timeout; absent if the page is slow), notes on media that
        will be converted to fit, and warnings. Nothing is saved or sent.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "200":
          description: The plan per account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/resolve:
    post:
      operationId: resolveSource
      tags: [posts]
      summary: Look up a post to reply to, quote or repost
      description: |
        Needs `posts:write`. Resolves a post URL (Bluesky, Mastodon) or a
        Nostr nevent/note id: its author, text and media, the account of
        yours on its network, and whether you can reply to, quote or
        repost it. Threads posts can't be resolved (its API has no URL
        lookup). Problems with the URL are `422` with a field code on
        `/url`: `unrecognized` (not a post URL or Nostr id),
        `not_supported` (Threads), `not_configured` (the network isn't
        configured here), `unresolvable` (not found, deleted, private, or
        not yet known to your server), `too_long`. When the post's network
        can't be reached (a timeout, a 5xx), the answer is `502`
        `upstream_failed`: try again.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceIn"
      responses:
        "200":
          description: The post and what you can do with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/translate:
    post:
      operationId: translate
      tags: [tools]
      summary: Translate text with DeepL
      description: |
        Needs `posts:write` (it spends the server's DeepL quota). `503` when
        no DeepL key is configured; `GET /v1/instance` says so in
        `features.translate` and lists `translate_targets`. A DeepL failure
        is `502 upstream_failed`.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateIn"
      responses:
        "200":
          description: The translation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Translation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/verify:
    post:
      operationId: verify
      tags: [tools]
      summary: Check who signed a post
      description: |
        Needs `posts:read`. Takes a Nostr event (its JSON), a Bluesky,
        Mastodon or Threads post URL, or an at:// URI, and reports who
        signed it and how sure that is. Uses no credentials. The verdict is
        always `200`: `status` is `verified`, `failed` (the signature or
        origin check failed: tampering or impersonation) or `error` (the
        check could not complete, which is not evidence of forgery).
      security:
        - bearer: ["posts:read"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyIn"
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}/nostr/relays:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    get:
      operationId: getNostrRelays
      tags: [tools]
      summary: A Nostr account's relays, for relay sync
      description: |
        Needs `admin`. Relay sync copies your events between your home
        relay and your other relays: the NIP-65 write relays your profile
        lists, and a secondary list kept on this server. `targets` is what
        a scan or sync goes through. `404` for an account that isn't the
        server's configured Nostr account. Relay URLs are stored and
        compared in one form: scheme and host in lower case, no default
        port, no trailing slash.
      security:
        - bearer: ["admin"]
        - session: []
      responses:
        "200":
          description: The relays.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NostrRelays"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setNostrRelays
      tags: [tools]
      summary: Replace the secondary relay list
      description: |
        Needs `admin`. At most 50 `ws://` or `wss://` relays: not the home
        relay, not Tor or I2P relays, and not loopback or link-local
        addresses (a relay on your own network is fine). Relays already
        listed keep their place; new ones follow, in the order given.
      security:
        - bearer: ["admin"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NostrRelaysIn"
      responses:
        "200":
          description: The relays, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NostrRelays"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}/nostr/relays:scan:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: scanNostrRelays
      tags: [tools]
      summary: Compare relays with the home relay
      description: |
        Needs `admin`. For each target relay (or the ones named in
        `relays`), how many of your events the home relay lacks and the
        relay lacks. Changes nothing. The body is optional. A relay that
        can't be reached is reported in its row, not as an error. One scan
        or sync runs at a time (`409` while another does), and each is
        bounded to 5 minutes: relays not reached in time are reported in
        their rows, so name fewer relays per call when many are slow.
        `502` when a named relay may be a NIP-65 one that couldn't be read;
        `503` when relay sync is not configured.
      security:
        - bearer: ["admin"]
        - session: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelaySelection"
      responses:
        "200":
          description: One row per relay.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [relays]
                properties:
                  relays:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelayScan"
        "400":
          $ref: "#/components/responses/BadRequest"
