  /v1/drafts:
    get:
      operationId: listDrafts
      tags: [drafts]
      summary: The drafts, the most recently changed first
      description: |
        Needs `drafts:read`. `q` finds drafts whose text or title contains
        it; each `tag` narrows to drafts with that tag (all of them).
      security:
        - bearer: ["drafts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
