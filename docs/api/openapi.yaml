openapi: 3.1.0
info:
  title: Publisher API
  version: "1"
  summary: Publish to Nostr, Bluesky, Mastodon, Threads and more from one place.
  description: |
    The `/v1` API of a self-hosted Publisher server. The web app uses it too.

    **Conventions**

    - JSON in and out, snake_case, RFC 3339 UTC timestamps, prefixed ids
      (`acc_`, `tok_`, and later `pst_`, `med_`, `drf_`).
    - Errors are RFC 9457 problem details (`application/problem+json`) with a
      stable `code`; see the [error catalogue](https://github.com/geofox/publisher/blob/main/docs/api/errors.md).
    - Lists take `?limit=` (1–200, default 50) and `?cursor=`, and answer
      `{"data": [...], "next_cursor": "..."}`; `next_cursor` is null on the
      last page. Cursors are opaque.
    - Creates marked as such honor `Idempotency-Key`
      (draft-ietf-httpapi-idempotency-key-header-08): a repeat with the same
      body gets the first response again, with `Idempotent-Replayed: true`;
      a different body with the same key gets `422 idempotency_key_reused`;
      a repeat while the first is running gets `409 idempotency_key_in_use`.
      Keys are kept 24 hours, per caller.
    - Responses are `Cache-Control: no-store`.

    **Authentication**

    Send `Authorization: Bearer <token>`, or use the browser session the web
    app signs in with. A bearer header wins over a session cookie. Tokens
    carry scopes; each operation names the one it needs (`admin` includes
    every scope). A session can do everything. When the server runs without
    OIDC, the reverse proxy in front of it is the gate and every request
    has every scope (a bearer token, if sent, is still checked).
  license:
    name: See the repository
    url: https://github.com/geofox/publisher
servers:
  - url: /
security:
  - bearer: []
  - session: []
tags:
  - name: instance
    description: The server and what it can do.
  - name: accounts
    description: Destination types and the accounts that publish to them.
  - name: tokens
    description: API tokens and the caller's identity.
  - name: posts
    description: Posts and what became of them on each account.
  - name: events
    description: Server-sent event streams of what happens to posts.
paths:
  /v1/openapi.json:
    get:
      operationId: getOpenAPI
      tags: [instance]
      summary: This document, as JSON
      security: []
      responses:
        "200":
          description: The OpenAPI description.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Problem"
  /v1/instance:
    get:
      operationId: getInstance
      tags: [instance]
      summary: Version, features, languages and limits
      description: Any authenticated caller.
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/destinations:
    get:
      operationId: listDestinations
      tags: [accounts]
      summary: Registered destination types and their manifests
      description: Needs `accounts:read`. Not paginated (a handful of types).
      security:
        - bearer: ["accounts:read"]
        - session: []
      responses:
        "200":
          description: Every registered type, sorted by type.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Manifest"
                  next_cursor:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: The owner's accounts, oldest first
      description: Needs `accounts:read`. Disabled accounts are listed too (they keep their history).
      security:
        - bearer: ["accounts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: One account
      description: Needs `accounts:read`.
      security:
        - bearer: ["accounts:read"]
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            examples: [acc_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      tags: [tokens]
      summary: Who is calling, and with which scopes
      description: Any authenticated caller.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: API tokens, newest first
      description: Needs `admin`. Revoked and expired tokens are listed with their status.
      security:
        - bearer: [admin]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a token
      description: |
        Needs `admin`. The response carries the token's `secret`, the only
        time it is shown: the server keeps only a hash.

        A token creating a token must give it an expiry no later than its
        own (`422 exceeds_caller`).

        Not idempotent, deliberately: replaying the response would mean
        storing the secret. A retried create makes a second token; revoke
        the one you did not keep.
      security:
        - bearer: [admin]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: The token, with its secret.
          headers:
            Location:
              description: The token's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          examples: [tok_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    get:
      operationId: getToken
      tags: [tokens]
      summary: One token (never its secret)
      description: Needs `admin`.
      security:
        - bearer: [admin]
        - session: []
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke a token
      description: |
        Needs `admin`. Takes effect at once. Revoking a revoked token
        succeeds too, so a retried call gets the same answer. The token
        stays listed, with status `revoked`.
      security:
        - bearer: [admin]
        - session: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: Posts, newest first
      description: |
        Needs `posts:read`. Hidden posts are left out unless `hidden=true`,
        which lists only hidden ones. Targets come without items or
        attempts; get a post for those.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Comma-separated post statuses to keep.
          schema:
            type: string
            examples: ["failed,needs_attention"]
        - name: account
          in: query
          description: Keep posts with a target on this account.
          schema:
            type: string
            pattern: "^acc_"
        - name: q
          in: query
          description: Keep posts whose text contains this.
          schema:
            type: string
        - name: since
          in: query
          description: Keep posts created at or after this time.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Keep posts created before this time.
          schema:
            type: string
            format: date-time
        - name: hidden
          in: query
          description: true lists hidden posts instead of shown ones.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of posts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      operationId: getPost
      tags: [posts]
      summary: One post, with its targets, items, deliveries and attempts
      description: Needs `posts:read`.
      security:
        - bearer: ["posts:read"]
        - session: []
      responses:
        "200":
          description: The post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Reschedule, hide or show a post
      description: |
        Needs `posts:write`. A JSON merge patch of `schedule.at` (a
        scheduled post only) and `hidden` (a post with nothing left to send
        only). Hiding keeps the post and its history; it only leaves the
        default list.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPatch"
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/PostPatch"
      responses:
        "200":
          description: The post after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}:cancel:
    parameters:
      - $ref: "#/components/parameters/PostID"
    post:
      operationId: cancelPost
      tags: [posts]
      summary: Cancel what a post has not sent
      description: |
        Needs `posts:write`. Stops what the post still has to send: all of
        a scheduled post, or the rest of a thread (the item being sent at
        that moment finishes). Failed items waiting for an automatic retry
        are canceled too; items whose outcome is `unknown` keep that status,
        since they may be live, but are no longer retried. Targets left
        `failed` or `partial` get `gave_up_at`, and a `:retry` still sends
        them by hand. The post becomes `canceled` when nothing went out,
        else `partial` or `failed`. The post stays in the history. With
        nothing left to send: 409.
      security:
        - bearer: ["posts:write"]
        - session: []
      responses:
        "200":
          description: The post after canceling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}:retry:
    parameters:
      - $ref: "#/components/parameters/PostID"
    post:
      operationId: retryPost
      tags: [posts]
      summary: Send a post's failed items again
      description: |
        Needs `posts:write`. Without a body, retries every target that
        failed, was missed, or is a thread that stopped part way. `targets`
        narrows that; `deliveries` retries single failed Nostr relays.
        Answers 202 at once: the engine sends within seconds, and the
        post's event stream reports the outcome. With nothing to retry: 409.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequest"
      responses:
        "202":
          description: The post, its items due again.
          headers:
            Location:
              description: The post's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}/events:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      operationId: streamPostEvents
      tags: [events]
      summary: A post's events, as server-sent events
      description: |
        Needs `posts:read`. Replays the post's events from the start (or
        after `Last-Event-ID` / `after`), then streams new ones, and ends
        once the post has nothing left to send. Each message has `id`,
        `event` (the type) and `data` (an Event as JSON). Events are kept
        7 days.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/LastEventID"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: All the owner's events, as server-sent events
      description: |
        Needs `posts:read`. Streams events from now on (or after
        `Last-Event-ID` / `after`, for a client catching up) until the
        client disconnects; a `: ping` comment every 15 seconds keeps idle
        connections open. Events are kept 7 days.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/LastEventID"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          $ref: "#/components/responses/EventStream"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token, created with `POST /v1/tokens` or in the web app.
    session:
      type: apiKey
      in: cookie
      name: publisher_session
      description: The web app's session, set by signing in (`/auth/login`).
  parameters:
    PostID:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [pst_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    LastEventID:
      name: Last-Event-ID
      in: header
      description: Resume after this event id (browsers send it on reconnect).
      schema:
        type: string
        pattern: "^[0-9]+$"
    After:
      name: after
      in: query
      description: Resume after this event id, for clients that can't set headers.
      schema:
        type: integer
        minimum: 0
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The previous page's `next_cursor`, unchanged.
      schema:
        type: string
  responses:
    InvalidState:
      description: Not possible in the resource's current state (`invalid_state`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    EventStream:
      description: |
        A stream of server-sent events. Each message's `data` is an Event.
      content:
        text/event-stream:
          schema:
            type: string
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The body is not acceptable JSON (`invalid_json`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadParameter:
      description: A query parameter is invalid (`invalid_parameter`, `invalid_cursor`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: No credentials, or credentials the server does not accept (`unauthenticated`).
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InsufficientScope:
      description: |
        The token lacks the operation's scope (`insufficient_scope`, with
        `WWW-Authenticate` naming it), or a browser write came from another
        site (`cross_origin`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource for this caller (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: Some fields are invalid (`validation_failed`); `errors` lists them.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PostStatus:
      type: string
      description: |
        `scheduled`, `publishing` (queued or being sent), then `published`,
        `partial` (some of it went out), `failed`, `canceled` or `missed`
        (a scheduled time passed while the server was down). Any settled
        post with an item in an unknown state, or one the engine gave up
        retrying, is `needs_attention`.
      enum: [scheduled, publishing, published, partial, failed, canceled, missed, needs_attention]
    Post:
      type: object
      additionalProperties: false
      required: [id, status, created_at, scheduled_at, hidden, source, content, interaction, targets]
      properties:
        id:
          type: string
          pattern: "^pst_"
        status:
          $ref: "#/components/schemas/PostStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        scheduled_at:
          $ref: "#/components/schemas/NullableTimestamp"
        hidden:
          type: boolean
        source:
          type: string
          description: What created it (web, api, …).
        content:
          type: object
          additionalProperties: false
          required: [text, media]
          properties:
            text:
              type: string
            media:
              type: array
              items:
                $ref: "#/components/schemas/PostMedia"
        interaction:
          description: Set when the post replies to, quotes or reposts another post.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [action, url]
              properties:
                action:
                  type: string
                  enum: [reply, quote, repost]
                url:
                  type: string
                platform:
                  type: string
                author:
                  type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"
    PostMedia:
      type: object
      additionalProperties: false
      required: [url, mime]
      properties:
        url:
          type: string
        mime:
          type: string
        alt:
          type: string
        sha256:
          type: string
        size_bytes:
          type: integer
        dim:
          type: string
          description: WIDTHxHEIGHT.
        blurhash:
          type: string
        duration_secs:
          type: integer
        poster_url:
          type: string
    TargetStatus:
      type: string
      enum: [scheduled, publishing, published, partial, failed, canceled, missed]
    Target:
      type: object
      description: One account the post goes to. Items and attempts are in a single post's view only.
      additionalProperties: false
      required: [id, account, type, status, gave_up_at]
      properties:
        id:
          type: string
          pattern: "^tgt_"
        account:
          type: string
          pattern: "^acc_"
        type:
          type: string
          description: The destination type.
        status:
          $ref: "#/components/schemas/TargetStatus"
        error_class:
          type: string
          description: The class of the latest failure (transient, rate_limited, auth, invalid, unknown, …).
        gave_up_at:
          description: When automatic retries stopped; a retry by hand starts them again.
          $ref: "#/components/schemas/NullableTimestamp"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
    ItemStatus:
      type: string
      enum: [planned, sending, published, partial, failed, unknown, canceled]
      description: "`unknown`: a send was in flight when the server stopped, and whether it went out is not known."
    Item:
      type: object
      description: One post the target makes (one, or one per thread part).
      additionalProperties: false
      required: [ordinal, status, text, media, attempts, next_attempt_at, published_at, deliveries]
      properties:
        ordinal:
          type: integer
        status:
          $ref: "#/components/schemas/ItemStatus"
        text:
          type: string
        media:
          type: array
          description: Indexes into the post's content.media.
          items:
            type: integer
        url:
          type: string
        remote_id:
          type: string
        error:
          type: string
        error_class:
          type: string
        attempts:
          type: integer
        next_attempt_at:
          description: When the engine sends it next; null when nothing is planned.
          $ref: "#/components/schemas/NullableTimestamp"
        published_at:
          $ref: "#/components/schemas/NullableTimestamp"
        deliveries:
          type: array
          description: Per-endpoint results, for destinations that deliver to several (Nostr relays).
          items:
            $ref: "#/components/schemas/Delivery"
    Delivery:
      type: object
      additionalProperties: false
      required: [endpoint, status, retries, attempted_at, gave_up_at]
      properties:
        endpoint:
          type: string
        status:
          type: string
          enum: [ok, failed, skipped, pending]
        message:
          type: string
        retries:
          type: integer
        attempted_at:
          $ref: "#/components/schemas/NullableTimestamp"
        gave_up_at:
          $ref: "#/components/schemas/NullableTimestamp"
    Attempt:
      type: object
      additionalProperties: false
      required: [number, status, latency_ms, attempted_at]
      properties:
        number:
          type: integer
        status:
          type: string
        error:
          type: string
        error_class:
          type: string
        latency_ms:
          type: integer
        attempted_at:
          $ref: "#/components/schemas/Timestamp"
    PostPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        schedule:
          type: object
          additionalProperties: false
          required: [at]
          properties:
            at:
              type: string
              format: date-time
        hidden:
          type: boolean
    RetryRequest:
      type: object
      additionalProperties: false
      properties:
        targets:
          type: array
          items:
            type: string
            pattern: "^tgt_"
        deliveries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [target, endpoint]
            properties:
              target:
                type: string
                pattern: "^tgt_"
              endpoint:
                type: string
    Event:
      type: object
      description: |
        The `data` of one server-sent event. Types: `post.created`,
        `post.updated` (status, schedule or visibility), `post.completed`
        (nothing left to send), `item.sending`, `item.published`,
        `item.partial`, `item.failed`, `item.unknown`, `item.canceled`,
        `delivery.updated`. Fields are present as the type needs.
      additionalProperties: false
      required: [id, type, created_at, post]
      properties:
        id:
          type: integer
        type:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        post:
          type: string
          pattern: "^pst_"
        status:
          type: string
          description: The post's status for post events; the item's or delivery's otherwise.
        target:
          type: string
        account:
          type: string
        destination:
          type: string
        ordinal:
          type: integer
        url:
          type: string
        error_class:
          type: string
        error:
          type: string
        endpoint:
          type: string
        scheduled_at:
          $ref: "#/components/schemas/Timestamp"
        hidden:
          type: boolean
    Problem:
      type: object
      description: An RFC 9457 problem with a stable `code`. Clients should ignore members they don't know (RFC 9457 §3.2).
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: This error's entry in the error catalogue.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: The request path.
        code:
          type: string
          enum:
            - not_found
            - method_not_allowed
            - unauthenticated
            - insufficient_scope
            - cross_origin
            - invalid_json
            - unsupported_media_type
            - too_large
            - validation_failed
            - invalid_parameter
            - invalid_cursor
            - invalid_state
            - idempotency_key_invalid
            - idempotency_key_in_use
            - idempotency_key_reused
            - unavailable
            - internal
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        pointer:
          type: string
          description: A JSON Pointer into the request body.
        parameter:
          type: string
          description: A query parameter's name.
        code:
          type: string
        detail:
          type: string
    NextCursor:
      description: The cursor for the next page; null on the last page.
      type: [string, "null"]
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, "null"]
      format: date-time
    Scope:
      type: string
      enum: ["posts:read", "posts:write", "media:write", "drafts:read", "drafts:write", "accounts:read", admin]
    Instance:
      type: object
      additionalProperties: false
      required: [version, auth, features, user_languages, translate_targets, limits, idempotency, scopes, destinations, pagination]
      properties:
        version:
          type: string
          description: The server build ("dev" for a local build).
        auth:
          type: string
          enum: [oidc, proxy]
          description: "`oidc`: the server signs people in. `proxy`: the reverse proxy in front is the gate."
        features:
          type: object
          additionalProperties: false
          required: [translate, video, public_feed, relay_sync]
          properties:
            translate:
              type: boolean
              description: DeepL translation is configured.
            video:
              type: boolean
              description: ffmpeg is present, so video can be processed.
            public_feed:
              type: boolean
              description: The public feed has a token.
            relay_sync:
              type: boolean
              description: Nostr relay-list sync is available.
        user_languages:
          type: array
          description: The operator's languages (ISO 639-1), in preference order.
          items:
            type: string
        translate_targets:
          type: array
          description: The user languages translation can target; empty without translation.
          items:
            type: string
        limits:
          type: object
          additionalProperties: false
          required: [max_json_body_bytes, max_upload_bytes, max_video_upload_bytes, max_images_per_request, max_idempotency_key_length]
          properties:
            max_json_body_bytes:
              type: integer
            max_upload_bytes:
              type: integer
            max_video_upload_bytes:
              type: integer
            max_images_per_request:
              type: integer
            max_idempotency_key_length:
              type: integer
        idempotency:
          type: object
          additionalProperties: false
          required: [ttl_secs]
          properties:
            ttl_secs:
              type: integer
              description: How long an Idempotency-Key is remembered.
        scopes:
          type: array
          description: The scopes a token can hold.
          items:
            $ref: "#/components/schemas/Scope"
        destinations:
          type: array
          description: The registered destination types.
          items:
            type: string
        pagination:
          type: object
          additionalProperties: false
          required: [default_limit, max_limit]
          properties:
            default_limit:
              type: integer
            max_limit:
              type: integer
    Manifest:
      type: object
      description: A destination type, the same for every account of it.
      additionalProperties: false
      required: [contract, type, name, kinds, defaults]
      properties:
        contract:
          type: integer
          description: The destination contract version the driver speaks.
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        name:
          type: string
        kinds:
          type: array
          items:
            type: string
            enum: [note, article]
        options:
          type: array
          description: The type's own settings, for a UI to render and the server to validate.
          items:
            $ref: "#/components/schemas/OptionSpec"
        defaults:
          $ref: "#/components/schemas/Capabilities"
    OptionSpec:
      type: object
      additionalProperties: false
      required: [key, type, label]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [bool, string, int, enum, enum_list]
        enum:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value:
                type: string
                description: '"" means the default.'
              label:
                type: string
        label:
          type: string
        help:
          type: string
        min:
          type: integer
        max:
          type: integer
    Capabilities:
      type: object
      description: What an account can do. Zero limits mean no limit.
      additionalProperties: false
      required: [text, title, threading, media, link_preview, content_warning, sensitive, languages, interactions, idempotent]
      properties:
        text:
          type: object
          additionalProperties: false
          required: [max_length, counting]
          properties:
            max_length:
              type: integer
            counting:
              type: object
              additionalProperties: false
              required: [unit]
              properties:
                unit:
                  type: string
                  description: graphemes, codepoints, utf16 or bytes ("" means graphemes).
                url_length:
                  type: integer
                  description: The fixed cost of every URL, when the network has one.
                mention_local_part_only:
                  type: boolean
        title:
          type: object
          additionalProperties: false
          required: [supported, required]
          properties:
            supported:
              type: boolean
            required:
              type: boolean
            max_length:
              type: integer
        threading:
          type: object
          additionalProperties: false
          required: [supported]
          properties:
            supported:
              type: boolean
            max_items:
              type: integer
        media:
          type: object
          additionalProperties: false
          required: [transport, images, video, mix_images_video, alt_text]
          properties:
            transport:
              type: string
              enum: [bytes, url]
            images:
              $ref: "#/components/schemas/MediaLimit"
            video:
              $ref: "#/components/schemas/MediaLimit"
            mix_images_video:
              type: boolean
            alt_text:
              type: boolean
            alt_max_length:
              type: integer
        link_preview:
          type: string
          enum: [none, server, client]
        content_warning:
          type: boolean
        sensitive:
          type: boolean
        languages:
          type: integer
          description: How many language tags a post can carry.
        visibility:
          type: array
          items:
            type: string
        interactions:
          type: object
          additionalProperties: false
          required: [reply, quote, repost]
          properties:
            reply:
              type: boolean
            quote:
              type: boolean
            repost:
              type: boolean
        idempotent:
          type: string
          enum: [none, key, natural]
          description: How a repeated publish of one item behaves on the network.
        idempotency_key_ttl_secs:
          type: integer
    MediaLimit:
      type: object
      additionalProperties: false
      required: [supported]
      properties:
        supported:
          type: boolean
        max_count:
          type: integer
        max_bytes:
          type: integer
        max_pixels:
          type: integer
        mimes:
          type: array
          items:
            type: string
        max_duration_secs:
          type: integer
        advisory_duration_secs:
          type: integer
    Account:
      type: object
      additionalProperties: false
      required: [id, type, label, source, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^acc_"
        type:
          type: string
          description: The destination type.
        label:
          type: string
        handle:
          type: string
        display_name:
          type: string
        avatar:
          type: string
          format: uri
          description: An absolute http(s) URL; absent when the profile has none.
        source:
          type: string
          description: Where the account is configured (`env` for now).
        enabled:
          type: boolean
        capabilities:
          description: Absent when this server has no driver for the account's type.
          $ref: "#/components/schemas/Capabilities"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    Token:
      type: object
      additionalProperties: false
      required: [id, name, scopes, status, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          pattern: "^tok_"
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/NullableTimestamp"
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        revoked_at:
          $ref: "#/components/schemas/NullableTimestamp"
    CreatedToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, status, created_at, last_used_at, expires_at, revoked_at, secret]
      properties:
        id:
          type: string
          pattern: "^tok_"
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          type: "null"
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        revoked_at:
          type: "null"
        secret:
          type: string
          description: The bearer value. Shown once; store it now.
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the token is for, such as the script that uses it.
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the token stops working, kept to the second; omit or null for never.
      examples:
        - name: n8n cross-posting
          scopes: ["posts:write", "media:write"]
          expires_at: "2027-11-05T00:00:00Z"
    Me:
      type: object
      additionalProperties: false
      required: [kind, scopes]
      properties:
        kind:
          type: string
          enum: [session, token, proxy]
          description: "`session`: signed in. `token`: a bearer token. `proxy`: OIDC is off and the reverse proxy let the request through."
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        user:
          type: object
          description: The signed-in person (sessions only).
          additionalProperties: false
          required: [id, subject]
          properties:
            id:
              type: string
            subject:
              type: string
            email:
              type: string
            name:
              type: string
        token:
          $ref: "#/components/schemas/Token"
