  /v1/accounts/{id}/nostr/relays:sync:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: syncNostrRelays
      tags: [tools]
      summary: Copy missing events between relays
      description: |
        Needs `admin`. `pull` copies the events the home relay lacks from
        each relay to it; `push` copies the events each relay lacks from
        the home relay. Events are your own, already signed: nothing is
        signed again. Per-relay outcomes are in the rows. Runs one at a
        time and within 5 minutes, as `:scan` does. `503` when relay sync
        is not configured.
      security:
        - bearer: ["admin"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelaySyncIn"
      responses:
        "200":
          description: One row per relay.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelaySyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public/feed:
    get:
      operationId: getPublicFeed
      tags: [tools]
      summary: Your published posts, for a homepage
      description: |
        Gated by its own token (`PUBLIC_FEED_TOKEN`), not an API token, so
        a website's server can read it while holding nothing that can
        post. `404` while no feed token is configured. Lists published,
        unhidden posts that aren't replies, with their public links (a
        Mastodon post that isn't public is left out), newest first.
      security:
        - feedToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFeed"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      operationId: getPost
      tags: [posts]
      summary: One post, with its targets, items, deliveries and attempts
      description: Needs `posts:read`.
      security:
        - bearer: ["posts:read"]
        - session: []
      responses:
        "200":
          description: The post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
