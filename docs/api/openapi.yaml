openapi: 3.1.0
info:
  title: Publisher API
  version: "1"
  summary: Publish to Nostr, Bluesky, Mastodon, Threads and more from one place.
  description: |
    The `/v1` API of a self-hosted Publisher server. The web app uses it too.

    **Conventions**

    - JSON in and out, snake_case, RFC 3339 UTC timestamps, prefixed ids
      (`acc_`, `tok_`, `pst_`, `tgt_`, `med_`, `drf_`).
    - Errors are RFC 9457 problem details (`application/problem+json`) with a
      stable `code`; see the [error catalogue](https://github.com/geofox/publisher/blob/main/docs/api/errors.md).
    - Lists take `?limit=` (1–200, default 50) and `?cursor=`, and answer
      `{"data": [...], "next_cursor": "..."}`; `next_cursor` is null on the
      last page. Cursors are opaque.
    - Creates marked as such honor `Idempotency-Key`
      (draft-ietf-httpapi-idempotency-key-header-08): a repeat with the same
      body gets the first response again, with `Idempotent-Replayed: true`;
      a different body with the same key gets `422 idempotency_key_reused`;
      a repeat while the first is running gets `409 idempotency_key_in_use`.
      Keys are kept 24 hours, per caller.
    - Responses are `Cache-Control: no-store`.

    **Authentication**

    Send `Authorization: Bearer <token>`, or use the browser session the web
    app signs in with. A bearer header wins over a session cookie. Tokens
    carry scopes; each operation names the one it needs (`admin` includes
    every scope but `accounts:write`). A session can do everything.

    The server signs the owner in with OIDC (`auth: oidc` in
    `/v1/instance`) or with its own passkeys and password (`auth: local`).
    In `proxy` mode it has no sign-in: the reverse proxy in front of it is
    the gate and every request has the scopes listed in `Scope` (a bearer
    token, if sent, is still checked); what needs a signed-in owner
    answers `403 sign_in_required`.

    Some operations need the owner to confirm it's them just now: they
    take a `Publisher-Reauth` nonce and answer `403 reauth_required`
    without one. Operations under `/v1/me/` other than `GET /v1/me` take a
    browser session only (`403 session_required` for a token).
  license:
    name: See the repository
    url: https://github.com/geofox/publisher
servers:
  - url: /
security:
  - bearer: []
  - session: []
tags:
  - name: instance
    description: The server and what it can do.
  - name: accounts
    description: Destination types and the accounts that publish to them.
  - name: tokens
    description: API tokens and the caller's identity.
  - name: sign-in
    description: How the owner signs in, where they are signed in, and what happened (browser sessions only).
  - name: posts
    description: Posts and what became of them on each account.
  - name: media
    description: Images and videos uploaded once and named by id in posts.
  - name: drafts
    description: Posts being written, saved to finish later.
  - name: events
    description: Server-sent event streams of what happens to posts.
  - name: tools
    description: Translation, signature checks, Nostr relay sync and the public feed.
paths:
  /v1/openapi.json:
    get:
      operationId: getOpenAPI
      tags: [instance]
      summary: This document, as JSON
      security: []
      responses:
        "200":
          description: The OpenAPI description.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Problem"
  /v1/instance:
    get:
      operationId: getInstance
      tags: [instance]
      summary: Version, features, languages and limits
      description: Any authenticated caller.
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/destinations:
    get:
      operationId: listDestinations
      tags: [accounts]
      summary: Registered destination types and their manifests
      description: Needs `accounts:read`. Not paginated (a handful of types).
      security:
        - bearer: ["accounts:read"]
        - session: []
      responses:
        "200":
          description: Every registered type, sorted by type.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Manifest"
                  next_cursor:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: The owner's accounts, oldest first
      description: |
        Needs `accounts:read`. Disabled accounts are listed too (they keep
        their history); deleted ones only with `include=deleted`.
      security:
        - bearer: ["accounts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: include
          in: query
          description: "`deleted` lists deleted accounts too (with `deleted_at`)."
          schema:
            type: string
            enum: [deleted]
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Add an account
      description: |
        Needs `accounts:write` and a master key (`PUBLISHER_MASTER_KEY`;
        `409 master_key_required` or `master_key_mismatch` otherwise).
        Refused behind the reverse proxy alone (`AUTH_MODE=proxy`: `403
        sign_in_required`), to tokens too.

        `type` and `method` come from `GET /v1/destinations` (`method` may
        be left out when the type has one). `config` holds the type's
        fields and `credentials` the method's, as their specs describe;
        defaults fill what is left out. Addresses must be `https` (or
        `http` for a host `PRIVATE_DESTINATIONS` allows), never the
        server itself; they are kept as their origin. What the network can
        find is looked up when left out: a Bluesky account's PDS from its
        handle or DID (a not-found answer is `422` with `not_found` on
        `/credentials/identifier`). `method: generate` makes the
        credential (a new Nostr key; read it once with `:reveal`).

        The account is then opened with the credentials and its network
        asked who it is (15 s at most). A refusal is `422
        credentials_rejected` with the network's words (at most 200
        characters, without what you sent); an unreachable network is
        `502 upstream_failed`. The same network account twice is `409
        duplicate_account` with the existing account's `account_id`.
        Nothing is stored until all of that passed; then the account and
        its credentials (sealed with the master key, for its server only)
        are stored in one step, with an `account.created` event naming the
        credentials (never their values). The new account is on, and not
        selected for new posts. The answer never carries a credential.

        Idempotent: send an `Idempotency-Key` so a retry can't add the
        account twice (the stored fingerprint of the request is keyed with
        the master key, so it can't be used to test a guess of the
        credentials). At most 10 accounts added or changed a minute
        (`429 rate_limited`); a replay doesn't count.
      security:
        - bearer: ["accounts:write"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: The account.
          headers:
            Location:
              description: The account's URL.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/AccountETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: One account
      description: Needs `accounts:read`. The `ETag` is for `If-Match` on `PATCH`.
      security:
        - bearer: ["accounts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: The account.
          headers:
            ETag:
              $ref: "#/components/headers/AccountETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Change your settings on an account
      description: |
        Needs `accounts:write`, a scope `admin` doesn't include: only the
        signed-in owner can grant it to a token. Each field sent replaces
        the account's; a field left out is kept, and `null` is refused.
        `label` is trimmed and must then be 1 to 64 characters, at least one
        of them visible, with no control, formatting or invisible
        characters (direction marks, zero-width spaces; a zero-width joiner
        is allowed after a visible character, as in emoji). `enabled:
        false` turns the account off: a new
        post can't pick it, and a post already waiting for it fails on it
        when its turn comes (retry it once the account is on again). A
        turned-off account still renews credentials that expire (a Threads
        token), so it works when turned on again.
        `default_selected` is whether the
        composer selects it for a new post; `public_feed` is whether its
        posts appear in the public feed. Send `If-Match` with the ETag you
        read: if the account changed since, the answer is `412
        precondition_failed` with the current `ETag`, and nothing changes.
        Without `If-Match` (or with `*`) the change applies to the account
        as the server reads it, and is still refused (412) if another
        change lands in between. A change is logged as an
        `account.updated` event naming the fields that changed. The answer
        is the whole account, as `GET /v1/accounts/{id}` shows it, so a
        token with `accounts:write` also reads the account it changes.

        An account added in the app (`source: db`) can also change its
        `config` (a merge patch: `null` puts a field back to its default),
        `credentials` (all of the method's, replacing the stored ones) and
        `method` (which needs its credentials). The result is opened and
        its network asked who it is first, as when adding it, and must be
        the same network account (`409 identity_changed`); a new server
        address needs the credentials again (`422` with `required` on
        `/credentials`), so they never go to a server they weren't given
        for. Errors are as for adding one; nothing changes when one
        happens. An account from the environment answers `409
        locked_by_env`. Behind the reverse proxy alone, `credentials` and
        `method` are refused (`403 sign_in_required`); `config` works.
        These count towards the limit of 10 accounts added or changed a
        minute.
      security:
        - bearer: ["accounts:write"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/AccountID"
        - $ref: "#/components/parameters/AccountIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: The account after the change.
          headers:
            ETag:
              $ref: "#/components/headers/AccountETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account added in the app
      description: |
        Needs a signed-in browser session, re-authenticated for
        `account.delete` with this account as the `target`. The account is
        turned off and marked deleted, its credentials and relay-sync
        lists are deleted, and what it still had to send (scheduled posts,
        retries) is canceled with the reason; its posts stay in the
        history, and `GET /v1/accounts?include=deleted` still lists it. An
        account from the environment can't be deleted (`409
        locked_by_env`: unset its variables). An `account.deleted` event
        is logged. An unknown account (`404`) or one from the environment
        is answered before asking for re-authentication.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/AccountID"
        - $ref: "#/components/parameters/Reauth"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ReauthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}:check:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: checkAccount
      tags: [accounts]
      summary: Check an account's credentials now
      description: |
        Needs `accounts:write`. Asks the account's network, with its
        credentials, whether they work, and answers the account with the
        result in `health` (its `status` follows: refused credentials make
        it `needs_reconnect`). Once every 10 seconds per account (`429
        rate_limited`). An account that isn't open, or whose network has
        no check, is `409 invalid_state`.
      security:
        - bearer: ["accounts:write"]
        - session: []
      responses:
        "200":
          description: The account, with the check's result.
          headers:
            ETag:
              $ref: "#/components/headers/AccountETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}:reveal:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: revealAccount
      tags: [accounts]
      summary: Show an account's key
      description: |
        A signed-in browser session, re-authenticated for
        `account.reveal` with this account as the `target`. Answers the
        credentials its type lets you see again, as you would type them: a
        Nostr key (`secret_key`, as `nsec1…`), to keep a copy. Never
        stored or cached (`Cache-Control: no-store`); not idempotent. An
        account whose credentials can't be shown is `409 invalid_state`;
        one from the environment is `409 locked_by_env` (read its
        variables). Both are answered before asking for
        re-authentication.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Reauth"
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [credentials]
                properties:
                  credentials:
                    type: object
                    additionalProperties:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ReauthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}:adopt:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: adoptAccount
      tags: [accounts]
      summary: Move an account from the environment into the app
      description: |
        A signed-in browser session and a master key. The account's
        configuration and credentials as the environment sets them (with
        a token it renewed since) are stored in the app, sealed, and its
        `source` becomes `db`; its id, history and your settings on it
        stay. From then on its variables are ignored (a warning at startup
        names them while they are set), and it can be changed and deleted
        in the app. Its addresses must pass the checks of an address typed
        in the app (`422` naming the field otherwise; `PRIVATE_DESTINATIONS`
        allows a private one). An `account.adopted` event names the fields.
        An account already in the app, or one the environment no longer
        configures, is `409 invalid_state`. To undo it, restore the backup
        made before.
      security:
        - session: []
      responses:
        "200":
          description: The account, now in the app.
          headers:
            ETag:
              $ref: "#/components/headers/AccountETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      tags: [tokens]
      summary: Who is calling, and with which scopes
      description: Any authenticated caller.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sign-in:
    get:
      operationId: getSignIn
      tags: [sign-in]
      summary: How the owner signs in
      description: |
        A signed-in browser session only. In `local` mode: the owner's
        passkeys and whether a password is set. With OIDC the list is
        empty: the identity provider handles sign-in. Behind the reverse
        proxy alone there is no session: `403 sign_in_required`.
      security:
        - session: []
      responses:
        "200":
          description: The sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignIn"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionOnly"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys:begin:
    post:
      operationId: beginPasskey
      tags: [sign-in]
      summary: Start adding a passkey
      description: |
        `local` mode, a signed-in browser session, re-authenticated for
        `signin.add`: the nonce is checked here and spent by `POST
        /v1/me/passkeys`, which takes the same one, so a passkey prompt
        that was cancelled can be started again without confirming again.
        Answers the options to pass to `navigator.credentials.create()` and
        sets a short-lived `publisher_ceremony` cookie (the request,
        sealed); finish within five minutes. Needs `PUBLIC_URL` (`409
        invalid_state` without it); at most 20 passkeys (`409
        invalid_state`). At most 20 starts a minute from one address,
        failed finishes included (`429 rate_limited`).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Reauth"
      responses:
        "200":
          description: The creation options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ReauthRequired"
        "409":
          $ref: "#/components/responses/InvalidState"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys:
    post:
      operationId: addPasskey
      tags: [sign-in]
      summary: Finish adding a passkey
      description: |
        `local` mode, the session that started it, with the `signin.add`
        nonce it started with (spent here). `credential` is the browser's
        `PublicKeyCredential` as JSON (`toJSON()`). A credential that
        doesn't check out answers `422 validation_failed` on
        `/credential`, with no more detail; a request that is unknown,
        expired, used or another session's, or a passkey already added,
        `409 invalid_state`. The passkey must be discoverable and verify
        the user.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Reauth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyFinish"
      responses:
        "201":
          description: The passkey.
          headers:
            Location:
              description: The passkey's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionOnly"
        "409":
          $ref: "#/components/responses/InvalidState"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^pk_"
          examples: [pk_3f2a9c0d1e4b5a6c7d8e]
    patch:
      operationId: renamePasskey
      tags: [sign-in]
      summary: Rename a passkey
      description: "`local` mode, a signed-in browser session."
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: 1 to 60 characters, no control characters; spaces are collapsed.
      responses:
        "200":
          description: The passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removePasskey
      tags: [sign-in]
      summary: Remove a passkey
      description: |
        `local` mode, re-authenticated for `signin.remove`. Every other
        session is signed out. The last usable way to sign in can't be
        removed (`409 last_sign_in_method`); a passkey made for another
        address (`usable: false`) always can. An unknown passkey (`404`) or
        the last way to sign in is answered before asking for
        re-authentication.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Reauth"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ReauthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/password:
    put:
      operationId: setPassword
      tags: [sign-in]
      summary: Set or change the password
      description: |
        `local` mode. Setting the first password needs re-authentication
        for `password.set`. Changing it needs the current one instead
        (`current_password`, which is the same proof: no nonce; a wrong
        one answers `422` on `/current_password` and counts towards the
        password throttle). Every other session is signed out.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Reauth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  writeOnly: true
                  description: 12 characters to 1024 bytes.
                current_password:
                  type: string
                  writeOnly: true
      responses:
        "204":
          description: Set.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ReauthRequired"
        "409":
          $ref: "#/components/responses/InvalidState"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removePassword
      tags: [sign-in]
      summary: Remove the password
      description: |
        `local` mode, re-authenticated for `signin.remove`. Only with a
        usable passkey left (`409 last_sign_in_method`, answered before
        asking for re-authentication). Every other session is signed out.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Reauth"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ReauthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sessions:
    get:
      operationId: listSessions
      tags: [sign-in]
      summary: Where the owner is signed in
      description: A signed-in browser session only. The most recently used first; `current` marks the caller's.
      security:
        - session: []
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionOnly"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^ses_"
    delete:
      operationId: endSession
      tags: [sign-in]
      summary: Sign a session out
      description: A signed-in browser session only; it may end itself.
      security:
        - session: []
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sign-in-events:
    get:
      operationId: listSignInEvents
      tags: [sign-in]
      summary: Recent sign-ins and changes to how you sign in
      description: |
        A signed-in browser session only, newest first: the last 50
        sign-ins, sign-in methods added, changed or removed, and tokens
        created, and with them the last 20 failed attempts (counted apart,
        so failures can't push the rest out). Failed attempts are recorded
        at most 10 per address and 100 in all in ten minutes (all are
        logged); an expired or unknown passkey request isn't one. They are
        not in the `/v1/events` stream.
      security:
        - session: []
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SignInEvent"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionOnly"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: API tokens, newest first
      description: Needs `admin`. Revoked and expired tokens are listed with their status.
      security:
        - bearer: [admin]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a token
      description: |
        Needs `admin`. The response carries the token's `secret`, the only
        time it is shown: the server keeps only a hash.

        A token creating a token must give it an expiry no later than its
        own, and can't give it `accounts:write` (`422 exceeds_caller`).

        A token holding `admin` or `accounts:write` can be created only by
        the owner signed in in a browser, re-authenticated for
        `token.create` (`Publisher-Reauth`): a token gets `403
        session_required`, and behind the reverse proxy alone, `403
        sign_in_required`. A signed-in browser re-authenticates for any
        token (a token outlives the session that made it).

        Not idempotent, deliberately: replaying the response would mean
        storing the secret. A retried create makes a second token; revoke
        the one you did not keep.
      security:
        - bearer: [admin]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Reauth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: The token, with its secret.
          headers:
            Location:
              description: The token's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          examples: [tok_6f1c2b9a0d3e4f5a6b7c8d9e0f1a2b3c]
    get:
      operationId: getToken
      tags: [tokens]
      summary: One token (never its secret)
      description: Needs `admin`.
      security:
        - bearer: [admin]
        - session: []
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke a token
      description: |
        Needs `admin`. Takes effect at once. Revoking a revoked token
        succeeds too, so a retried call gets the same answer. The token
        stays listed, with status `revoked`.
      security:
        - bearer: [admin]
        - session: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: Posts, newest first
      description: |
        Needs `posts:read`. Hidden posts are left out unless `hidden=true`,
        which lists only hidden ones. Targets come without items or
        attempts; get a post for those.
      security:
        - bearer: ["posts:read"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Comma-separated post statuses to keep.
          schema:
            type: string
            examples: ["failed,needs_attention"]
        - name: account
          in: query
          description: Keep posts with a target on this account.
          schema:
            type: string
            pattern: "^acc_"
        - name: q
          in: query
          description: Keep posts whose text contains this.
          schema:
            type: string
        - name: since
          in: query
          description: Keep posts created at or after this time.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Keep posts created before this time.
          schema:
            type: string
            format: date-time
        - name: hidden
          in: query
          description: true lists hidden posts instead of shown ones.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of posts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadParameter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPost
      tags: [posts]
      summary: Publish or schedule a post
      description: |
        Needs `posts:write`. Shared `content` goes to every account in
        `targets`; each target can override the text, content warning,
        sensitivity and languages, and set its destination's `options`
        (listed by `GET /v1/destinations`, plus `visibility` where the
        account's capabilities list values). Media are named by id, from
        `POST /v1/media`, and must be `ready`. Text too long for an account
        is split into a thread there (`threading.numbering` adds 1/n
        counters); `POST /v1/posts:preview` shows the split.

        The post is saved before anything is sent, then the engine sends
        it. The answer is `202` at once, with the post `publishing` (or
        `scheduled`, with `schedule.at`). With `Prefer: wait=N` (seconds,
        at most 60) it waits until the post settles and answers `201`
        with the outcome, or `202` if it has not settled by then;
        `Preference-Applied` says the wait was honored. A scheduled post
        does not wait. `reply_to`, `quote` or `repost` (see SourceIn) make
        the post an interaction with another post. Idempotent: send an `Idempotency-Key` so a retried
        request can't post twice. While a request waits, a retry with its
        key gets `409 idempotency_key_in_use`; `Prefer` is not part of the
        request's identity, so a retry that adds a wait gets the first
        answer back without waiting.
      security:
        - bearer: ["posts:write"]
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Prefer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "201":
          description: The post, settled within the wait.
          headers:
            Location:
              description: The post's URL.
              schema:
                type: string
            Preference-Applied:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "202":
          description: The post, saved; the engine is sending it (or will, when scheduled).
          headers:
            Location:
              description: The post's URL.
              schema:
                type: string
            Preference-Applied:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts:preview:
    post:
      operationId: previewPost
      tags: [posts]
      summary: Plan a post without sending it
      description: |
        Needs `posts:write`. Takes the body of `POST /v1/posts`, validates it
        the same way and answers what each account would get: its thread
        items with the media each carries, the link card (fetched with a
        short timeout; absent if the page is slow), notes on media that
        will be converted to fit, and warnings. Nothing is saved or sent.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "200":
          description: The plan per account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/resolve:
    post:
      operationId: resolveSource
      tags: [posts]
      summary: Look up a post to reply to, quote or repost
      description: |
        Needs `posts:write`. Resolves a post URL (Bluesky, Mastodon) or a
        Nostr nevent/note id: its author, text and media, the account of
        yours on its network, and whether you can reply to, quote or
        repost it. The post is looked up with `account` when you name
        one, or else with your first connected account on its network;
        the answer's `account` is the account used. Threads posts can't
        be resolved (its API has no URL lookup). A named `account` that
        isn't yours is `422` `unknown_account` on `/account`; one on
        another network is `not_allowed`; one that isn't connected is
        `account_disabled`. Problems with the URL are `422` with a field
        code on `/url`:
        `unrecognized` (not a post URL or Nostr id), `not_supported`
        (Threads), `not_configured` (none of your accounts on that network
        is connected), `unresolvable` (not found, deleted, private, or not
        yet known to your server), `too_long`. When the post's network
        can't be reached (a timeout, a 5xx), the answer is `502`
        `upstream_failed`: try again.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIn"
      responses:
        "200":
          description: The post and what you can do with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/translate:
    post:
      operationId: translate
      tags: [tools]
      summary: Translate text with DeepL
      description: |
        Needs `posts:write` (it spends the server's DeepL quota). `503` when
        no DeepL key is configured; `GET /v1/instance` says so in
        `features.translate` and lists `translate_targets`. A DeepL failure
        is `502 upstream_failed`.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateIn"
      responses:
        "200":
          description: The translation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Translation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/verify:
    post:
      operationId: verify
      tags: [tools]
      summary: Check who signed a post
      description: |
        Needs `posts:read`. Takes a Nostr event (its JSON), a Bluesky,
        Mastodon or Threads post URL, or an at:// URI, and reports who
        signed it and how sure that is. Uses no credentials. The verdict is
        always `200`: `status` is `verified`, `failed` (the signature or
        origin check failed: tampering or impersonation) or `error` (the
        check could not complete, which is not evidence of forgery).
      security:
        - bearer: ["posts:read"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyIn"
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}/nostr/relays:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    get:
      operationId: getNostrRelays
      tags: [tools]
      summary: A Nostr account's relays, for relay sync
      description: |
        Needs `admin`. Relay sync copies your events between your home
        relay and your other relays: the NIP-65 write relays your profile
        lists, and a secondary list kept on this server. `targets` is what
        a scan or sync goes through. Each Nostr account has its own home
        relay, key and list. `404` for an account that isn't one of your
        Nostr accounts; `409` while it can't be used (turned off, not
        configured), saying why. Relay URLs are stored and
        compared in one form: scheme and host in lower case, no default
        port, no trailing slash.
      security:
        - bearer: ["admin"]
        - session: []
      responses:
        "200":
          description: The relays.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NostrRelays"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setNostrRelays
      tags: [tools]
      summary: Replace the secondary relay list
      description: |
        Needs `admin`. At most 50 `ws://` or `wss://` relays: not the home
        relay, not Tor or I2P relays, and not loopback or link-local
        addresses (a relay on your own network is fine). Relays already
        listed keep their place; new ones follow, in the order given.
      security:
        - bearer: ["admin"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NostrRelaysIn"
      responses:
        "200":
          description: The relays, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NostrRelays"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/{id}/nostr/relays:scan:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: scanNostrRelays
      tags: [tools]
      summary: Compare relays with the home relay
      description: |
        Needs `admin`. For each target relay (or the ones named in
        `relays`), how many of your events the home relay lacks and the
        relay lacks. Changes nothing. The body is optional. A relay that
        can't be reached is reported in its row, not as an error. One scan
        or sync runs at a time (`409` while another does), and each is
        bounded to 5 minutes: relays not reached in time are reported in
        their rows, so name fewer relays per call when many are slow.
        `502` when a named relay may be a NIP-65 one that couldn't be read;
        `503` when relay sync is not configured.
      security:
        - bearer: ["admin"]
        - session: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelaySelection"
      responses:
        "200":
          description: One row per relay.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [relays]
                properties:
                  relays:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelayScan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
