        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}:cancel:
    parameters:
      - $ref: "#/components/parameters/PostID"
    post:
      operationId: cancelPost
      tags: [posts]
      summary: Cancel what a post has not sent
      description: |
        Needs `posts:write`. Stops what the post still has to send: all of
        a scheduled post, or the rest of a thread (the item being sent at
        that moment finishes, and is not retried if it fails). Failed items waiting for an automatic retry
        are canceled too; items whose outcome is `unknown` keep that status,
        since they may be live, but are no longer retried. Targets left
        `failed` or `partial` get `gave_up_at`, and a `:retry` still sends
        them by hand. The post becomes `canceled` when nothing went out,
        else `partial` or `failed`. The post stays in the history. With
        nothing left to send: 409.
      security:
        - bearer: ["posts:write"]
        - session: []
      responses:
        "200":
          description: The post after canceling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}:resolve:
    parameters:
      - $ref: "#/components/parameters/PostID"
    post:
      operationId: resolveItem
      tags: [posts]
      summary: Say whether an item whose outcome is unknown went out
      description: |
        Needs `posts:write`. An item is `unknown` when a send was in flight
        as the server stopped and the network can't be trusted to drop a
        repeat (Bluesky and Threads always; Mastodon once its idempotency
        key has expired, after an hour): it may be live. Check the account,
        then say what you found.

        `not_published`: the item is sent again now, then the rest of its
        thread. `published`: the item is recorded as live. With its `url`,
        the server looks the post up (Bluesky, Mastodon) to check it is the
        account's own and to get the reference the next item replies to,
        and the rest of the thread is sent under it; the `url` is required
        then. Where posts can't be looked up (Threads), the URL is kept as
        given, and the rest of the thread is canceled: nothing can reply to
        the post (the target ends `partial`; a `:retry` fails those parts as
        `invalid` rather than post them detached). An item that isn't
        `unknown`: 409.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveItemRequest"
      responses:
        "200":
          description: The post, with the item resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/posts/{id}:retry:
    parameters:
      - $ref: "#/components/parameters/PostID"
    post:
      operationId: retryPost
      tags: [posts]
      summary: Send a post's failed items again
      description: |
        Needs `posts:write`. Without a body (an empty one counts), retries
        every target that failed, was missed or canceled, or is a thread
        that stopped part way; items a cancel stopped are sent too.
        `targets` narrows that; `deliveries` retries single failed Nostr
        relays, each named once.
        Answers 202 at once: the engine sends within seconds, and the
        post's event stream reports the outcome. With nothing to retry: 409.
      security:
        - bearer: ["posts:write"]
        - session: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequest"
      responses:
        "202":
          description: The post, its items due again.
          headers:
            Location:
              description: The post's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload an image or a video
      description: |
        Needs `media:write`. Send `multipart/form-data` with a `file` part
        (and optional `alt` and `preset` parts, in any order), or the file itself as the
        body with its `image/*` or `video/*` type and `alt` and `preset` in
        the query. The type is read from the file's content (JPEG, PNG,
        GIF, WebP, HEIC, or a video). Images are stored in media storage at once: `201`,
        `ready`. Videos are normalized in the background (`preset`:
        `1080p`, the default, `720p` or `480p`): `202`, `processing`; poll
        `GET /v1/media/{id}` until it is `ready` or `failed`. Images are at
        most 64 MiB, videos 1 GiB. Not idempotent: a repeat stores the
        same file again under a new id.
      security:
        - bearer: ["media:write"]
        - session: []
      parameters:
        - name: alt
          in: query
          description: Alt text, for a raw body.
          schema:
            type: string
        - name: preset
          in: query
          description: Video size, for a raw body.
          schema:
            type: string
            enum: ["1080p", "720p", "480p"]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                alt:
                  type: string
                preset:
                  type: string
          image/*:
            schema:
              type: string
              contentMediaType: application/octet-stream
          video/*:
            schema:
              type: string
              contentMediaType: application/octet-stream
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "201":
          description: The image, stored.
          headers:
            Location:
              description: The media's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaObject"
        "202":
          description: The video, being processed.
          headers:
            Location:
              description: The media's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaObject"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Invalid"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "507":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/media:compress:
