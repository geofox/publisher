      description: |
        Needs `media:write`. Re-encodes an image as JPEG with a `preset`:
        `large` (2048 px long edge), `medium` (1600), `small` (1080) or
        `convert` (full size; turns HEIC into JPEG). Answers the new
        bytes; nothing is stored. Send `multipart/form-data` with `file` and
        `preset` parts, or the image as the body with `preset` in the query.
